<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>TalkSys Overlay</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;pointer-events:none}body.debug{background:#e4e4e7}.overlay{position:absolute;inset:0;width:100%;height:100%}.label{position:absolute;max-width:min(420px,70vw);padding:8px 11px;border-radius:9px;background:rgba(24,24,27,.92);color:#fff;font:700 15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.24);transform:translate(-50%,-100%);margin-top:-24px;white-space:normal}.hidden{display:none}
  </style>
</head>
<body>
  <svg id="svg" class="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div id="label" class="label hidden"></div>
  <script src="overlay.js"></script>
</body>
</html>
