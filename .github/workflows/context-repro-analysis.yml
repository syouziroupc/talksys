name: Context repro analysis
on:
  push:
    branches:
      - analysis/context-repro-20261002

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: A/B context resolution variants
        shell: bash
        run: |
          node <<'NODE'
          const base='https://talksys.syouziroupc.workers.dev';
          const seedTurns=[
            '別府市のおすすめのイタリアンレストランについて教えて。',
            '元マチバルっていうところがいいと聞きましたが。',
            '泡盛と沖縄そばの店923について教えて。',
            'パソコンが壊れて買い替えたいけど安い中古パソコンで何を買えばいいかが分かんない。予算は3万円ぐらい。ネットで買いたい。'
          ];
          async function buildSeed(label){
            const sessionId='analysis-'+label+'-'+Date.now();
            let previousInteractionId='';
            let history=[];
            for(let i=0;i<seedTurns.length;i++){
              const text=seedTurns[i];
              const r=await fetch(base+'/api/turn',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
                text,history:history.slice(-14),sessionId,utteranceId:label+'-seed-'+(i+1),previousInteractionId,channel:'discord'
              })});
              const j=await r.json();
              if(j.interactionReset) previousInteractionId=''; else if(j.interactionId) previousInteractionId=j.interactionId;
              if(j.ok&&j.answer) history.push({role:'user',content:text},{role:'assistant',content:j.answer});
            }
            return {sessionId,previousInteractionId,history};
          }
          async function finalCall(label, mutate){
            const seed=await buildSeed(label);
            const payload={
              text:'おすすめのお店を教えてください。',
              history:seed.history.slice(-14),
              sessionId:seed.sessionId,
              utteranceId:label+'-final',
              previousInteractionId:seed.previousInteractionId,
              channel:'discord'
            };
            mutate(payload);
            const started=Date.now();
            const r=await fetch(base+'/api/turn',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
            const j=await r.json();
            console.log('VARIANT '+JSON.stringify({
              label,http:r.status,elapsedMs:Date.now()-started,
              sentPreviousInteractionId:Boolean(payload.previousInteractionId),
              speechAlternatives:payload.speechAlternatives||[],
              answer:j.answer||'',search:Boolean(j.search),queries:j.queries||[],
              interactionReset:Boolean(j.interactionReset),route:j.route||'',
              groundingRecoveryUsed:Boolean(j.groundingRecoveryUsed)
            }));
          }
          await finalCall('baseline',()=>{});
          await finalCall('explicit-history',p=>{p.previousInteractionId='';});
          await finalCall('nova-alternative',p=>{p.speechAlternatives=['予算は3万円ぐらい。ネットで買いたい。おすすめのお店を教えてください。'];});
          NODE
