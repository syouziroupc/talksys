name: Context repro analysis
on:
  push:
    branches:
      - analysis/context-repro-20261002
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: Test anchor with live previous interaction retained
        run: |
          node <<'NODE'
          const base='https://talksys.syouziroupc.workers.dev';
          const sessionId='analysis-anchor-live-'+Date.now();
          let previousInteractionId='';
          const history=[];
          const seed=[
            '別府市のおすすめのイタリアンレストランについて教えて。',
            '元マチバルっていうところがいいと聞きましたが。',
            '泡盛と沖縄そばの店923について教えて。',
            'パソコンが壊れて買い替えたいけど安い中古パソコンで何を買えばいいかが分かんない。予算は3万円ぐらい。ネットで買いたい。'
          ];
          for(let i=0;i<seed.length;i++){
            const text=seed[i];
            const r=await fetch(base+'/api/turn',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
              text,history:history.slice(-14),sessionId,utteranceId:'seed-'+i,previousInteractionId,channel:'discord'
            })});
            const j=await r.json();
            if(j.interactionReset) previousInteractionId=''; else if(j.interactionId) previousInteractionId=j.interactionId;
            if(j.ok&&j.answer) history.push({role:'user',content:text},{role:'assistant',content:j.answer});
          }
          for(const variant of [
            {label:'raw',text:'おすすめのお店を教えてください。'},
            {label:'anchored',text:'直前の相談は、予算3万円くらいでネットで中古パソコンを買い替える話です。その条件で、おすすめのお店を教えてください。'}
          ]){
            const r=await fetch(base+'/api/turn',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
              text:variant.text,history:history.slice(-14),sessionId,utteranceId:variant.label,previousInteractionId,channel:'discord'
            })});
            const j=await r.json();
            console.log('ANCHOR_LIVE '+JSON.stringify({
              label:variant.label,answer:j.answer||'',queries:j.queries||[],search:Boolean(j.search),
              interactionReset:Boolean(j.interactionReset),route:j.route||''
            }));
          }
          NODE
