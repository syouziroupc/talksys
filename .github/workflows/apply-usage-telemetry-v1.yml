name: Apply Usage Telemetry v1

on:
  push:
    branches:
      - feat/phone-usage-telemetry-v1
    paths:
      - .diagnostics/usage-telemetry-v1-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/phone-usage-telemetry-v1
          fetch-depth: 0

      - name: Apply observational usage telemetry patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          integrated_path = Path('src/integrated-entry.js')
          integrated = integrated_path.read_text()
          integrated = replace_once(
              integrated,
              "import { WEB_VOICE_CAPTURE_POLICY } from './voice-capture-policy.js';\n",
              "import { WEB_VOICE_CAPTURE_POLICY } from './voice-capture-policy.js';\nimport { mergeProviderUsage, normalizeGeminiUsage, USAGE_TELEMETRY_REVISION } from './usage-telemetry.js';\n",
              'integrated import',
          )
          integrated = replace_once(
              integrated,
              "  let interactionsRegionFallback = Boolean(interaction?.regionFallback);\n  const primaryMs = Date.now() - primaryStarted;\n",
              "  let interactionsRegionFallback = Boolean(interaction?.regionFallback);\n  const usageRecords = [normalizeGeminiUsage(interaction?.payload || {}, { transport: interaction?.transport || 'interactions' })];\n  const primaryMs = Date.now() - primaryStarted;\n",
              'primary usage record',
          )
          integrated = replace_once(
              integrated,
              "      const recoverySearched = searchedInInteraction(recovery.payload);\n",
              "      usageRecords.push(normalizeGeminiUsage(recovery?.payload || {}, { transport: recovery?.transport || 'generateContent' }));\n      const recoverySearched = searchedInInteraction(recovery.payload);\n",
              'grounding recovery usage',
          )
          directional_old = """    interaction = await createGeminiTurnWithRegionFallback(env, { ...body, text: repairText, previousInteractionId: '', history: [] }, signal, {\n      allowPrevious: false,\n      forceSearch: true,\n      now,\n      immediateTransit,\n    });\n    interactionsRegionFallback = interactionsRegionFallback || Boolean(interaction?.regionFallback);\n    searchRetried = true;\n"""
          directional_new = """    interaction = await createGeminiTurnWithRegionFallback(env, { ...body, text: repairText, previousInteractionId: '', history: [] }, signal, {\n      allowPrevious: false,\n      forceSearch: true,\n      now,\n      immediateTransit,\n    });\n    usageRecords.push(normalizeGeminiUsage(interaction?.payload || {}, { transport: interaction?.transport || 'interactions' }));\n    interactionsRegionFallback = interactionsRegionFallback || Boolean(interaction?.regionFallback);\n    searchRetried = true;\n"""
          integrated = replace_once(integrated, directional_old, directional_new, 'directional repair usage')
          temporal_old = """      interaction = await createGeminiTurnWithRegionFallback(env, repair, signal, { allowPrevious: false, forceSearch: true, now, immediateTransit: true });\n      interactionsRegionFallback = interactionsRegionFallback || Boolean(interaction?.regionFallback);\n"""
          temporal_new = """      interaction = await createGeminiTurnWithRegionFallback(env, repair, signal, { allowPrevious: false, forceSearch: true, now, immediateTransit: true });\n      usageRecords.push(normalizeGeminiUsage(interaction?.payload || {}, { transport: interaction?.transport || 'interactions' }));\n      interactionsRegionFallback = interactionsRegionFallback || Boolean(interaction?.regionFallback);\n"""
          integrated = replace_once(integrated, temporal_old, temporal_new, 'temporal repair usage')
          integrated = replace_once(
              integrated,
              "  if (!answer) throw new Error('empty_spoken_answer');\n\n  return {\n",
              "  if (!answer) throw new Error('empty_spoken_answer');\n  const apiUsage = mergeProviderUsage(usageRecords);\n\n  return {\n",
              'usage merge',
          )
          integrated = replace_once(
              integrated,
              "    queries,\n    sources,\n    apiSources: [],\n    interactionId:",
              "    queries,\n    sources,\n    apiSources: [],\n    apiUsage,\n    interactionId:",
              'result api usage',
          )
          integrated = replace_once(
              integrated,
              "      verified: Boolean(result?.genericVerificationSucceeded),\n",
              "      verified: Boolean(result?.genericVerificationSucceeded),\n      usageRevision: result?.apiUsage?.revision || USAGE_TELEMETRY_REVISION,\n      providerCalls: Number(result?.apiUsage?.providerCalls || 0),\n      searchCalls: Number(result?.apiUsage?.searchCalls || 0),\n      inputTokens: Number(result?.apiUsage?.inputTokens || 0),\n      outputTokens: Number(result?.apiUsage?.outputTokens || 0),\n      totalTokens: Number(result?.apiUsage?.totalTokens || 0),\n      cachedTokens: Number(result?.apiUsage?.cachedTokens || 0),\n      usageAvailable: Boolean(result?.apiUsage?.usageAvailable),\n",
              'answer complete usage log',
          )
          integrated_path.write_text(integrated)

          telephony_path = Path('src/telephony/index.js')
          telephony = telephony_path.read_text()
          telephony = replace_once(
              telephony,
              "turn_error:'AIエラー',tts_error:'TTSエラー'",
              "api_usage:'API使用量',tts_usage:'TTS使用量',turn_error:'AIエラー',tts_error:'TTSエラー'",
              'phone usage stage labels',
          )
          telephony = replace_once(
              telephony,
              "{samples:samples.length});let stt;",
              "{samples:samples.length,audioMs:Math.round(samples.length/8)});let stt;",
              'stt audio usage',
          )
          telephony = replace_once(
              telephony,
              "        if(pendingSttCount>0){const pendingStartedAt=Date.now();",
              "        if(turn?.payload?.apiUsage)queueLatency(turnId,'api_usage',answerReadyAt-speechEndAt,turn.payload.apiUsage);\n        if(pendingSttCount>0){const pendingStartedAt=Date.now();",
              'phone provider usage event',
          )
          telephony = replace_once(
              telephony,
              "    if(turnId)queueLatency(turnId,`${purpose}_complete`,Date.now()-originAt,{streamMs:Date.now()-audioReadyAt,frames:streamed.frames,bytes:streamed.sentBytes});\n    console.log(JSON.stringify({type:'phone_tts_sent'",
              "    if(turnId)queueLatency(turnId,`${purpose}_complete`,Date.now()-originAt,{streamMs:Date.now()-audioReadyAt,frames:streamed.frames,bytes:streamed.sentBytes});\n    if(turnId)queueLatency(turnId,'tts_usage',Date.now()-originAt,{purpose,provider:audio.metadata?.provider||'',model:audio.metadata?.model||'',durationMs:audio.metadata?.durationMs||0,frames:streamed.frames,bytes:streamed.sentBytes,cached:Boolean(options?.preparedAudio)});\n    console.log(JSON.stringify({type:'phone_tts_sent'",
              'phone tts usage event',
          )
          telephony_path.write_text(telephony)

          registry_path = Path('architecture/capabilities.json')
          registry = registry_path.read_text()
          registry = replace_once(
              registry,
              '      "companions": [\n        "src/entry.js"\n      ],',
              '      "companions": [\n        "src/entry.js",\n        "src/usage-telemetry.js"\n      ],',
              'usage telemetry registry companion',
          )
          registry_path.write_text(registry)

          Path('tests/usage-telemetry-v1.test.mjs').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport { mergeProviderUsage, normalizeGeminiUsage, USAGE_TELEMETRY_REVISION } from '../src/usage-telemetry.js';\n\nconst integrated = fs.readFileSync(new URL('../src/integrated-entry.js', import.meta.url), 'utf8');\nconst telephony = fs.readFileSync(new URL('../src/telephony/index.js', import.meta.url), 'utf8');\n\ntest('usage telemetry normalizes Gemini Interactions usage without another API call', () => {\n  const usage = normalizeGeminiUsage({\n    usage: { total_input_tokens: 120, total_output_tokens: 30, total_cached_tokens: 40, total_tool_use_tokens: 12, grounding_tool_count: 1 },\n    steps: [{ type: 'google_search_call' }],\n  }, { transport: 'interactions' });\n  assert.equal(usage.revision, USAGE_TELEMETRY_REVISION);\n  assert.equal(usage.inputTokens, 120);\n  assert.equal(usage.outputTokens, 30);\n  assert.equal(usage.cachedTokens, 40);\n  assert.equal(usage.toolUseTokens, 12);\n  assert.equal(usage.searchCalls, 1);\n  assert.equal(usage.totalTokens, 150);\n  assert.equal(usage.usageAvailable, true);\n});\n\ntest('usage telemetry normalizes generateContent usageMetadata', () => {\n  const usage = normalizeGeminiUsage({\n    usageMetadata: { promptTokenCount: 80, candidatesTokenCount: 20, cachedContentTokenCount: 15, toolUsePromptTokenCount: 7, thoughtsTokenCount: 3, totalTokenCount: 110 },\n    candidates: [{ groundingMetadata: { webSearchQueries: ['query'] } }],\n  }, { transport: 'generateContent' });\n  assert.equal(usage.inputTokens, 80);\n  assert.equal(usage.outputTokens, 20);\n  assert.equal(usage.cachedTokens, 15);\n  assert.equal(usage.toolUseTokens, 7);\n  assert.equal(usage.thoughtTokens, 3);\n  assert.equal(usage.totalTokens, 110);\n  assert.equal(usage.searchCalls, 1);\n});\n\ntest('usage telemetry merges multiple provider calls additively', () => {\n  const merged = mergeProviderUsage([\n    normalizeGeminiUsage({ usage: { total_input_tokens: 100, total_output_tokens: 20 } }, { transport: 'interactions' }),\n    normalizeGeminiUsage({ usageMetadata: { promptTokenCount: 50, candidatesTokenCount: 10, totalTokenCount: 60 } }, { transport: 'generateContent' }),\n  ]);\n  assert.equal(merged.providerCalls, 2);\n  assert.equal(merged.inputTokens, 150);\n  assert.equal(merged.outputTokens, 30);\n  assert.equal(merged.totalTokens, 180);\n  assert.match(merged.transport, /interactions/);\n  assert.match(merged.transport, /generateContent/);\n});\n\ntest('usage telemetry remains observational and preserves the phone quality path', () => {\n  assert.match(integrated, /apiUsage/);\n  assert.match(integrated, /normalizeGeminiUsage/);\n  assert.match(integrated, /mergeProviderUsage/);\n  assert.match(telephony, /api_usage/);\n  assert.match(telephony, /tts_usage/);\n  assert.match(telephony, /talksys-telephony-v87-grok-pcmu-paced/);\n  assert.match(telephony, /streamPcmu20ms\\(audio\\.bytes/);\n  assert.doesNotMatch(telephony, /bidirectionalMode=\\\"mp3\\\"/);\n});\n""")
          PY

          node --check src/usage-telemetry.js
          node --check src/integrated-entry.js
          node --check src/telephony/index.js
          node --test tests/usage-telemetry-v1.test.mjs

      - name: Commit patch to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrated-entry.js src/telephony/index.js src/usage-telemetry.js architecture/capabilities.json tests/usage-telemetry-v1.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add observational phone API usage telemetry v1"
          git push origin HEAD:feat/phone-usage-telemetry-v1
