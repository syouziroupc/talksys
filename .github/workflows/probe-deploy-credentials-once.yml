name: Probe legacy TalkSys deployment credentials once

on:
  push:
    branches: [tmp-v46-prod-probe]
    paths:
      - '.github/workflows/probe-deploy-credentials-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    env:
      TOKEN1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN2: ${{ secrets.CLOUDFLARE_TOKEN }}
      TOKEN3: ${{ secrets.CF_API_TOKEN }}
      TOKEN4: ${{ secrets.WRANGLER_API_TOKEN }}
      APIKEY1: ${{ secrets.CLOUDFLARE_API_KEY }}
      APIKEY2: ${{ secrets.CF_API_KEY }}
      EMAIL1: ${{ secrets.CLOUDFLARE_EMAIL }}
      EMAIL2: ${{ secrets.CF_EMAIL }}
      HOOK1: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      HOOK2: ${{ secrets.CLOUDFLARE_BUILD_HOOK }}
      HOOK3: ${{ secrets.DEPLOY_HOOK_URL }}
      HOOK4: ${{ secrets.WORKERS_DEPLOY_HOOK }}
      ACCOUNT1: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT3: ${{ vars.CF_ACCOUNT_ID }}
      ACCOUNT4: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          present(){ if [[ -n "${!1:-}" ]]; then echo "$1=true"; else echo "$1=false"; fi; }
          for x in TOKEN1 TOKEN2 TOKEN3 TOKEN4 APIKEY1 APIKEY2 EMAIL1 EMAIL2 HOOK1 HOOK2 HOOK3 HOOK4 ACCOUNT1 ACCOUNT2 ACCOUNT3 ACCOUNT4; do present "$x"; done
