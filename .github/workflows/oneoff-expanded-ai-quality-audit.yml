name: One-off expanded AI quality audit

on:
  push:
    branches:
      - qa/expanded-ai-quality-prompt-audit-v1
    paths:
      - 'qa/answer-quality-cases.json'
      - '.github/workflows/oneoff-expanded-ai-quality-audit.yml'
      - 'scripts/answer-quality-audit.mjs'
      - 'scripts/answer-quality-audit-phone-boundary.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AUDIT_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate expanded audit source
        run: |
          set -euo pipefail
          node --check scripts/answer-quality-audit.mjs
          node --check scripts/answer-quality-audit-phone-boundary.mjs
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('qa/answer-quality-cases.json','utf8'));if(!Array.isArray(d)||d.length<30)throw new Error('expanded audit suite is incomplete');console.log('cases='+d.length)"
          test -n "${GEMINI_API_KEY:-}"
      - name: Run expanded production phone AI boundary audit
        id: audit
        continue-on-error: true
        run: |
          set -uo pipefail
          node scripts/answer-quality-audit-phone-boundary.mjs
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish summary
        if: always()
        run: |
          echo '# Expanded TalkSys production phone-AI quality audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f artifacts/answer-quality-audit/report.md ]]; then
            cat artifacts/answer-quality-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-answer-quality-report
          path: artifacts/answer-quality-audit/
          retention-days: 30
      - name: Enforce runner health
        if: always()
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code || '1' }}
        run: |
          set -euo pipefail
          if [[ "$AUDIT_EXIT_CODE" != "0" ]]; then
            echo "Audit runner failed with exit code $AUDIT_EXIT_CODE"
            exit 1
          fi
          test -f artifacts/answer-quality-audit/report.json
          node -e "const r=require('./artifacts/answer-quality-audit/report.json'); console.log('Expanded audit: '+r.passed+'/'+r.total+' passed; '+r.failed+' failed');"
