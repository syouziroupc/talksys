name: Apply R5 stdin and fast reaction fix

on:
  push:
    branches:
      - fix/r5-barge-stdin-fast-reaction
    paths:
      - scripts/apply-r5-barge-stdin-fast-reaction.mjs
      - discord-voice-smoke/src/ffmpeg-stdin.mjs
      - tests/discord-ffmpeg-stdin.test.mjs
      - .github/workflows/apply-r5-barge-stdin-fast-reaction.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r5-barge-stdin-fast-reaction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded runtime patch
        run: node scripts/apply-r5-barge-stdin-fast-reaction.mjs
      - name: Syntax check Discord runtime
        run: node --check discord-voice-smoke/src/index.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run active tests
        run: npm test
      - name: Run ffmpeg stdin regression tests
        run: node --test tests/discord-ffmpeg-stdin.test.mjs
      - name: Commit runtime patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord-voice-smoke/src/index.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "fix(discord): guard barge-in pipe and restore fast reactions"
          git push origin HEAD:fix/r5-barge-stdin-fast-reaction
