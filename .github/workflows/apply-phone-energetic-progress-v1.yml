name: Apply Phone Energetic Progress v1

on:
  push:
    branches:
      - feat/phone-energetic-progress-v1
    paths:
      - .diagnostics/phone-energetic-progress-v1-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/phone-energetic-progress-v1
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 -c "from pathlib import Path; p=Path('.diagnostics/apply-phone-energetic-progress-v1.py'); s=p.read_text(); s=s.replace('(?:検索|調べ|探して|探す|確認して|確認|見つけて|見つける|教えて|知りたい)', '(?:検索(?:して)?|調べて?|探して|探す|確認して|確認|見つけて|見つける|教えて|知りたい)'); p.write_text(s)"
          python3 .diagnostics/apply-phone-energetic-progress-v1.py
      - name: Validate focused contracts
        run: |
          node --check src/telephony/index.js
          node --check src/telephony/phone-tts.js
          node --test tests/phone-energetic-progress-v1.test.mjs tests/phone-fast-reaction-v2.test.mjs tests/phone-latency-fast-ack-v90.test.mjs
          npx wrangler deploy --dry-run
      - name: Commit patch to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telephony/index.js wrangler.jsonc tests/phone-energetic-progress-v1.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use energetic phone voice and add lookup progress speech"
          git push origin HEAD:feat/phone-energetic-progress-v1
