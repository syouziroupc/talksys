name: Diagnose v45 retrieval once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v45-retrieval-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Probe Bing RSS exact phrases
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { parseBingRss } from './src/search-fallbacks.js';
          const queries = [
            '"中古ノートパソコン"',
            '"中古ノートパソコン" 30000',
            '"中古ノートパソコン" SSD',
            '"中古ノートPC"',
            'site:jp "中古ノートパソコン"',
            'site:iosys.co.jp ノートパソコン 中古',
            'site:pcwrap.com ノートパソコン 中古',
            'site:janpara.co.jp ノートパソコン 中古'
          ];
          for (const q of queries) {
            const u=`https://www.bing.com/search?format=rss&mkt=ja-JP&setlang=ja-JP&cc=jp&q=${encodeURIComponent(q)}`;
            try {
              const r=await fetch(u,{headers:{'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36','accept':'application/rss+xml,application/xml,text/xml'}});
              const rows=parseBingRss(await r.text(),8);
              console.log('BING',JSON.stringify({q,status:r.status,rows:rows.map(x=>({title:x.title,url:x.url}))}));
            } catch(e) { console.log('BINGERR',q,e?.message); }
          }
          NODE
