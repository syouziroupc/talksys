name: Diagnose phone profiles login

on:
  push:
    branches: [fix-phone-profiles-login-button]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fetch production phone profiles page and verify login binding
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://talksys.syouziroupc.workers.dev/phone-profiles -o /tmp/page.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/page.html').read_text()
          m=re.search(r'<script>(.*?)</script>', html, re.S)
          if not m: raise SystemExit('inline script missing')
          Path('/tmp/inline.js').write_text(m.group(1))
          print('button-present=', 'id="loginBtn"' in html)
          print('script-bytes=', len(m.group(1)))
          PY
          node --check /tmp/inline.js
          node <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const elements=new Map();
          const make=(id)=>({id,value:'',textContent:'',innerHTML:'',className:'',dataset:{},classList:{add(){},remove(){}},addEventListener(){},querySelectorAll(){return[]}});
          global.sessionStorage={getItem(){return ''},setItem(){}};
          global.document={getElementById(id){if(!elements.has(id))elements.set(id,make(id));return elements.get(id)},querySelectorAll(){return[]}};
          global.location={href:'https://talksys.syouziroupc.workers.dev/phone-profiles'};
          global.history={replaceState(){}};
          global.alert=()=>{};
          vm.runInThisContext(fs.readFileSync('/tmp/inline.js','utf8'));
          const btn=document.getElementById('loginBtn');
          if(typeof btn.onclick!=='function') throw new Error('loginBtn onclick was not bound');
          console.log('login-binding=ok');
          NODE
