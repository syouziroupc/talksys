name: Repair phone profiles login

on:
  push:
    branches: [fix-phone-profiles-login-button]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Repair rendered newline escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/telephony/index.js')
          s=p.read_text()
          start=s.index('function profilesDashboardHtml(request)')
          end=s.index('\nfunction dashboardHtml(request)', start)
          segment=s[start:end]
          old=".join('\\n')"
          new=".join('\\\\n')"
          count=segment.count(old)
          if count == 1:
              segment=segment.replace(old,new,1)
              s=s[:start]+segment+s[end:]
              p.write_text(s)
              print('patched phone profiles newline escape')
          elif count == 0 and new in segment:
              print('phone profiles newline escape already repaired')
          else:
              raise SystemExit(f'unexpected newline escape count: {count}')
          PY
      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check src/telephony/index.js
          node --test tests/phone-profiles-browser-script.test.mjs
          npm test
      - name: Commit repair if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/telephony/index.js; then
            echo 'No source repair commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/telephony/index.js
          git commit -m 'Fix phone profiles display button browser script'
          git push origin HEAD:fix-phone-profiles-login-button
