name: Validate grounding evidence gate v110

on:
  push:
    branches: [fix/grounding-evidence-gate-v110]
    paths:
      - '.github/workflows/oneoff-grounding-evidence-gate-v110.yml'
      - 'scripts/apply-grounding-evidence-gate-v110.py'
      - 'src/grounding-evidence-gate.js'
      - 'tests/grounding-evidence-gate-v110.test.mjs'
      - 'src/integrated-entry.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply evidence-gated grounding patch
        run: python scripts/apply-grounding-evidence-gate-v110.py

      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check src/grounding-evidence-gate.js
          node --check src/integrated-entry.js

      - name: Grounding gate tests
        run: node --test tests/grounding-evidence-gate-v110.test.mjs

      - name: Phone fast-reaction regression suites
        run: |
          set -euo pipefail
          mapfile -t suites < <(find tests -maxdepth 1 -type f \( -iname '*phone*test.mjs' -o -iname '*telephony*test.mjs' -o -iname '*fast*reaction*test.mjs' -o -iname '*fast*ack*test.mjs' \) | sort)
          if (( ${#suites[@]} == 0 )); then
            echo 'No dedicated phone/telephony regression suites found; full suite remains mandatory.'
          else
            printf 'Running %s\n' "${suites[@]}"
            node --test "${suites[@]}"
          fi

      - name: Architecture check
        run: npm run architecture:check

      - name: Architecture graph
        run: npm run architecture:graph

      - name: Full test suite with concise failure diagnostics
        run: |
          set +e
          npm test 2>&1 | tee /tmp/talksys-full-test.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            echo '--- concise failing-test diagnostics ---'
            grep -E -C 4 '(^not ok|ERR_ASSERTION|AssertionError|Error:|fail [0-9]+|# fail)' /tmp/talksys-full-test.log | tail -n 240 || true
            exit "$status"
          fi

      - name: Worker dry run
        run: npx wrangler deploy --dry-run

      - name: Commit validated runtime change to feature branch
        run: |
          set -euo pipefail
          git config user.name talksys-automation
          git config user.email actions@users.noreply.github.com
          git add src/integrated-entry.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No runtime change to commit.'
            exit 0
          fi
          git commit -m 'Gate factual answers on Gemini search evidence'
          git push origin HEAD:${{ github.ref_name }}
