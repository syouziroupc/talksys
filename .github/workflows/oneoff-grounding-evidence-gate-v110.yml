name: Apply grounding evidence gate v110

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-grounding-evidence-gate-v110.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply evidence-gated grounding patch
        run: python scripts/apply-grounding-evidence-gate-v110.py

      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check src/grounding-evidence-gate.js
          node --check src/integrated-entry.js

      - name: Grounding gate tests
        run: node --test tests/grounding-evidence-gate-v110.test.mjs

      - name: Architecture check
        run: npm run architecture:check

      - name: Architecture graph
        run: npm run architecture:graph

      - name: Full test suite
        run: npm test

      - name: Worker dry run
        run: npx wrangler deploy --dry-run

      - name: Commit validated runtime change
        run: |
          set -euo pipefail
          git config user.name talksys-automation
          git config user.email actions@users.noreply.github.com
          git add src/integrated-entry.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No runtime change to commit.'
            exit 0
          fi
          git commit -m 'Gate factual answers on Gemini search evidence'
          git push origin HEAD:main

