name: Patch TalkSys served revision markers once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-gemini-25-lite-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Make runtime revision markers unconditional
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/talk-client-v45.js')
          s = p.read_text()
          old = '''client = client.replace(
            "'use strict';",
            "'use strict';\\nwindow.__TALKSYS_CLIENT_REVISION__='" + CLIENT_REVISION + "';\\nwindow.__TALKSYS_INTERACTION_REVISION__='" + INTERACTION_REVISION + "';",
          );'''
          new = '''client = "window.__TALKSYS_CLIENT_REVISION__='" + CLIENT_REVISION + "';\\nwindow.__TALKSYS_INTERACTION_REVISION__='" + INTERACTION_REVISION + "';\\n" + client;'''
          if s.count(old) != 1:
              raise SystemExit(f'unexpected revision-marker block count: {s.count(old)}')
          s = s.replace(old, new)
          anchor = "if (!client.includes('非常文字入力で現在の応答を割込み')) throw new Error('TalkSys typed-interrupt patch did not apply');"
          guard = """if (!client.includes("window.__TALKSYS_CLIENT_REVISION__='" + CLIENT_REVISION + "'") || !client.includes("window.__TALKSYS_INTERACTION_REVISION__='" + INTERACTION_REVISION + "'")) throw new Error('TalkSys runtime revision markers did not apply');
"""
          if s.count(anchor) != 1:
              raise SystemExit('runtime assertion anchor missing')
          s = s.replace(anchor, guard + anchor)
          p.write_text(s)

          p = Path('tests/v45-shell-regression.test.mjs')
          s = p.read_text()
          anchor = "  assert.match(TALK_CLIENT_V45, /planner:'gemini-native'/);"
          addition = """  assert.match(TALK_CLIENT_V45, /__TALKSYS_CLIENT_REVISION__='talksys-v46-streaming-vad'/);
  assert.match(TALK_CLIENT_V45, /__TALKSYS_INTERACTION_REVISION__='talksys-v50-native-gemini-2-5-flash-lite-r1'/);"""
          if s.count(anchor) != 1:
              raise SystemExit('test anchor missing')
          s = s.replace(anchor, anchor + '\n' + addition)
          p.write_text(s)
          PY

          git diff --check
          git diff -- src/talk-client-v45.js tests/v45-shell-regression.test.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Smoke patched tree before commit
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:check
          npm run architecture:graph
          find src archive -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run

      - name: Commit verified marker fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/talk-client-v45.js tests/v45-shell-regression.test.mjs
          git commit -m 'Fix served TalkSys revision markers'
          git push origin HEAD:main
