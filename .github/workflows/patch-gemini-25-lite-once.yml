name: Inspect TalkSys production turn error once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-gemini-25-lite-once.yml'

permissions:
  contents: read

jobs:
  inspect-production-turn:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v6
      - name: Capture API status and body
        shell: bash
        run: |
          set -u
          body="$(mktemp)"
          headers="$(mktemp)"
          code="$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"text":"12345÷15","history":[]}' \
            "$PRODUCTION_URL/api/turn" || true)"
          echo "HTTP_STATUS=$code"
          echo '--- headers ---'
          cat "$headers"
          echo '--- body ---'
          cat "$body"
          echo
          rm -f "$body" "$headers"
