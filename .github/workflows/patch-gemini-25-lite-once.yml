name: Harden TalkSys factual grounding once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-gemini-25-lite-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply JST and evidence-first hardening
        run: |
          python3 scripts/harden-jst-v53.py
          python3 scripts/harden-factual-v54.py
      - name: Review patch
        run: |
          git diff --check
          git diff -- src/entry.js src/worker-v44.js src/search-v45.js tests/jst-router-v53.test.mjs tests/evidence-first-v54.test.mjs tests/gemini-api-cutover-v47.test.mjs
      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate hardened runtime
        run: |
          npm run architecture:check
          npm run architecture:graph
          find src archive -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run
      - name: Commit verified factual hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/entry.js src/worker-v44.js src/search-v45.js tests/jst-router-v53.test.mjs tests/evidence-first-v54.test.mjs tests/gemini-api-cutover-v47.test.mjs
          git commit -m 'Harden TalkSys factual answers with evidence-first routing'
          git push origin HEAD:main
