name: Diagnose TalkSys production turns once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-gemini-25-lite-once.yml'

permissions:
  contents: read

jobs:
  diagnose-production-turns:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Probe deterministic, weather, and contextual turns with retries
        shell: bash
        run: |
          set -euo pipefail

          request_with_retry() {
            local label="$1"
            local payload="$2"
            local timeout="$3"
            local body_file
            body_file="$(mktemp)"
            local code=""
            for attempt in $(seq 1 6); do
              : > "$body_file"
              code="$(curl -sS --max-time "$timeout" -o "$body_file" -w '%{http_code}' \
                -H 'content-type: application/json' \
                --data "$payload" \
                "$PRODUCTION_URL/api/turn" || true)"
              echo "[$label] attempt=$attempt http=$code"
              cat "$body_file"
              echo
              if [[ "$code" == "200" ]]; then
                cat "$body_file"
                rm -f "$body_file"
                return 0
              fi
              sleep 2
            done
            echo "[$label] failed after retries; last_http=$code" >&2
            rm -f "$body_file"
            return 1
          }

          deterministic="$(request_with_retry deterministic '{"text":"12345÷15","history":[]}' 20)"
          printf '%s\n' "$deterministic"
          deterministic_body="$(printf '%s\n' "$deterministic" | tail -n 1)"
          OUT="$deterministic_body" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.route!=='deterministic-v45'||d.search!==false||!String(d.answer||'').includes('823'))throw new Error(process.env.OUT);"

          weather="$(request_with_retry weather '{"text":"別府市の今日の天気は？","history":[]}' 75)"
          printf '%s\n' "$weather"
          weather_body="$(printf '%s\n' "$weather" | tail -n 1)"
          OUT="$weather_body" node -e "const d=JSON.parse(process.env.OUT||'{}');const tools=(d.apiSources||[]).map(x=>x.tool);if(!d.ok||d.route!=='api-first-v45'||!tools.includes('jma_weather')||d.generationProvider!=='gemini')throw new Error(process.env.OUT);"

          contextual="$(request_with_retry contextual '{"text":"どれがいい？","history":[{"role":"user","content":"大学のレポート用に中古ノートPCを探してる。予算は3万円。"},{"role":"assistant","content":"Officeとブラウザ中心ですね。"}]}' 45)"
          printf '%s\n' "$contextual"
          contextual_body="$(printf '%s\n' "$contextual" | tail -n 1)"
          OUT="$contextual_body" node -e "const d=JSON.parse(process.env.OUT||'{}');const a=String(d.answer||'');if(!d.ok||a.length<8||d.generationProvider!=='gemini'||/何について|もう少し詳しく|詳しく教えて/.test(a))throw new Error(process.env.OUT);"
