name: Migrate TalkSys to Gemini 3.5 Flash-Lite once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-gemini-25-lite-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Patch active runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          targets = list(Path('src').glob('*.js')) + list(Path('tests').glob('*.mjs'))
          old_model = 'gemini-2.5-flash-lite'
          new_model = 'gemini-3.5-flash-lite'
          old_revision = 'talksys-v50-native-gemini-2-5-flash-lite-r1'
          new_revision = 'talksys-v52-native-gemini-3-5-flash-lite-r1'
          model_changes = 0
          revision_changes = 0

          for path in targets:
              text = path.read_text()
              model_changes += text.count(old_model)
              revision_changes += text.count(old_revision)
              text = text.replace(old_model, new_model)
              text = text.replace(old_revision, new_revision)
              path.write_text(text)

          if model_changes < 1:
              raise SystemExit('No active Gemini 2.5 Flash-Lite references were found')
          if revision_changes < 1:
              raise SystemExit('No active v50 interaction revision references were found')
          print(f'model_changes={model_changes} revision_changes={revision_changes}')
          PY
          git diff --check
          git diff -- src tests

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate migrated runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:check
          npm run architecture:graph
          find src archive -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Migrate TalkSys to Gemini 3.5 Flash-Lite'
          git push origin HEAD:main
