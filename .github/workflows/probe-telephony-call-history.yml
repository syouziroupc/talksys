name: Probe TalkSys telephony call history

on:
  push:
    branches: [main]
    paths:
      - '.telnyx/history-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Query aggregate phone call evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require('child_process');
          const sql = "SELECT COUNT(*) AS total_calls, SUM(CASE WHEN message_count > 0 THEN 1 ELSE 0 END) AS conversational_calls, MAX(updated_at) AS latest_call_update FROM phone_calls WHERE replace(replace(replace(to_number,' ',''),'-',''),'(', '') LIKE '%5031501235%';";
          const r = spawnSync('npx', ['wrangler','d1','execute','talksys-conversation-logs','--remote','--json','--command',sql], { encoding: 'utf8', env: process.env });
          if (r.status !== 0) {
            process.stderr.write(r.stderr || r.stdout || 'wrangler d1 failed');
            process.exit(r.status || 1);
          }
          const d = JSON.parse(r.stdout || '[]');
          const rows = Array.isArray(d) ? (d[0]?.results || []) : (d.result?.[0]?.results || []);
          const row = rows[0] || {};
          console.log(JSON.stringify({
            totalCallsToTalkSysNumber: Number(row.total_calls || 0),
            conversationalCalls: Number(row.conversational_calls || 0),
            latestCallUpdate: row.latest_call_update || null
          }, null, 2));
          NODE
