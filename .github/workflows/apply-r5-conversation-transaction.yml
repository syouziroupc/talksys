name: Apply R5 conversation transaction

on:
  push:
    branches:
      - fix/r5-voice-stability-coordinator
    paths:
      - scripts/apply-r5-conversation-transaction.mjs
      - tests/discord-conversation-transaction.test.mjs
      - .github/workflows/apply-r5-conversation-transaction.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r5-voice-stability-coordinator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded transaction patch
        run: node scripts/apply-r5-conversation-transaction.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run active tests
        run: npm test
      - name: Run transaction tests
        run: node --test tests/discord-conversation-transaction.test.mjs
      - name: Commit transactional runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord-voice-smoke/src/index.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "fix(discord): commit conversation only after playback"
          git push origin HEAD:fix/r5-voice-stability-coordinator
