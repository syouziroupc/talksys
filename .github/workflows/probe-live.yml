name: Probe TalkSys Live

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe-production:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production Worker
        shell: bash
        run: |
          set +e
          host=talksys.syouziroupc.workers.dev
          echo "===== PRODUCTION: $host ====="
          getent ahosts "$host" | head -20 || true
          echo "--- /health ---"
          curl -sS -i --max-time 20 "https://$host/health" | head -40 || true
          echo "--- /voice-health ---"
          curl -sS -i --max-time 20 "https://$host/voice-health" | head -60 || true
          echo "--- /api/model-smoke ---"
          curl -sS -i --max-time 30 "https://$host/api/model-smoke" | head -60 || true
          echo "--- /api/voice-smoke ---"
          curl -sS -D - -o /tmp/voice-smoke.bin --max-time 30 "https://$host/api/voice-smoke" | head -60 || true
          test -f /tmp/voice-smoke.bin && wc -c /tmp/voice-smoke.bin || true

  probe-v14-temporary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Deploy v14.1 to isolated temporary Cloudflare account
        id: deploy
        shell: bash
        run: |
          set +e
          npx wrangler deploy --temporary > /tmp/wrangler-temp.log 2>&1
          code=$?
          echo "temporary_deploy_exit=$code"
          python <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/wrangler-temp.log').read_text(errors='replace')
          # Never expose the bearer claim URL or temporary credentials in public logs.
          safe = re.sub(r'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^\s]+', '[CLAIM URL REDACTED]', text)
          safe = re.sub(r'(?i)(apiToken|tokenId|claimToken)\s*[:=]\s*[^\s]+', r'\1=[REDACTED]', safe)
          urls = re.findall(r'https://[A-Za-z0-9.-]+\.workers\.dev', text)
          print('temporary_workers_url=' + (urls[-1] if urls else ''))
          for line in safe.splitlines():
              if any(k in line for k in ['ERROR', 'Error', 'Uploaded ', 'Deployed ', 'Temporary account ready', 'Account:', 'Claim within:', 'CLAIM URL REDACTED', 'workers.dev']):
                  print(line[:500])
          Path('/tmp/temp-url.txt').write_text(urls[-1] if urls else '')
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Probe temporary v14.1 endpoints
        shell: bash
        run: |
          set +e
          url="$(cat /tmp/temp-url.txt 2>/dev/null)"
          if [ -z "$url" ]; then
            echo "No temporary Worker URL; deployment did not produce a preview."
            exit 0
          fi
          echo "===== TEMPORARY V14.1: $url ====="
          for path in /health /voice-health /api/model-smoke; do
            echo "--- $path ---"
            curl -sS -i --max-time 35 "$url$path" | head -80 || true
          done
          echo "--- /api/voice-smoke ---"
          curl -sS -D - -o /tmp/v14-voice.bin --max-time 35 "$url/api/voice-smoke" | head -80 || true
          test -f /tmp/v14-voice.bin && wc -c /tmp/v14-voice.bin || true
