name: Apply TalkSys truth gate r3 once

on:
  push:
    branches: [tmp-v46-truth-gate-r3]
    paths:
      - '.github/workflows/apply-v46-truth-gate-r3-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp-v46-truth-gate-r3
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Repair migration quoting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-v46-truth-gate-r3.mjs')
          s = p.read_text()
          s = s.replace(
              "    `${clean(item?.title, 300)} ${clean(item?.excerpt || item?.snippet, 2600)}`",
              "    clean(item?.title, 300) + ' ' + clean(item?.excerpt || item?.snippet, 2600)",
          )
          s = s.replace(
              "  const allowed = normalizedEvidenceAnchor(`${canonicalizeInput(question, 2200)} ${evidenceText}`);",
              "  const allowed = normalizedEvidenceAnchor(canonicalizeInput(question, 2200) + ' ' + evidenceText);",
          )
          s = s.replace(
              "    const body = normalize(`${item?.title || ''} ${item?.excerpt || item?.snippet || ''}`);",
              "    const body = normalize((item?.title || '') + ' ' + (item?.excerpt || item?.snippet || ''));",
          )
          p.write_text(s)
          PY
          node --check scripts/apply-v46-truth-gate-r3.mjs

      - name: Apply r3 hardening
        run: node scripts/apply-v46-truth-gate-r3.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Validate r3 implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker-v44.js
          node --check src/search-v45.js
          node --check src/free-api-tools-v45.js
          node --check tests/v46-truth-gate-r3.test.mjs
          npm run architecture:check
          npm run architecture:graph
          npm test
          npx wrangler deploy --dry-run

      - name: Mark production trigger
        shell: bash
        run: |
          set -euo pipefail
          printf 'truth-gate-r3 %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/production-trigger.txt

      - name: Commit validated r3 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name talksys-automation
          git config user.email actions@users.noreply.github.com
          git add src/worker-v44.js src/search-v45.js src/free-api-tools-v45.js tests/v46-truth-gate-r3.test.mjs .github/workflows/deploy.yml .deploy/production-trigger.txt
          git commit -m 'Enforce external fact truth gate and semantic transit evidence'
          git pull --rebase origin tmp-v46-truth-gate-r3
          git push origin HEAD:tmp-v46-truth-gate-r3
