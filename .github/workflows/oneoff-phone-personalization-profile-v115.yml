name: Apply phone personalization profile v115

on:
  push:
    branches: [feat/phone-personalization-profile-v115]
    paths:
      - '.github/workflows/oneoff-phone-personalization-profile-v115.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply v115 profile patch
        run: python3 scripts/apply-phone-personalization-profile-v115.py
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: node --check src/telephony/index.js
      - name: Focused profile tests
        run: node --test tests/phone-personalization-profile-v115.test.mjs
      - name: Architecture checks
        run: |
          npm run architecture:check
          npm run architecture:graph
          npm run reuse:check
      - name: Full active test suite
        run: npm test
      - name: Worker dry run
        run: npx wrangler deploy --dry-run
      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-phone-personalization-profile-v115.py .github/workflows/oneoff-phone-personalization-profile-v115.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/telephony/index.js tests/phone-personalization-profile-v115.test.mjs scripts/apply-phone-personalization-profile-v115.py .github/workflows/oneoff-phone-personalization-profile-v115.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add phone caller profile admin foundation v115'
          git push origin HEAD:feat/phone-personalization-profile-v115
