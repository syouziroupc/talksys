name: Apply Phone Fast Reaction v2

on:
  push:
    branches:
      - feat/phone-fast-reaction-v2
    paths:
      - .diagnostics/phone-fast-reaction-v2-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/phone-fast-reaction-v2
          fetch-depth: 0

      - name: Apply Fast Reaction v2 patch
        run: python3 .diagnostics/apply-phone-fast-reaction-v2.py

      - name: Validate focused contracts
        run: |
          node --check src/telephony/index.js
          node --test tests/phone-fast-reaction-v2.test.mjs tests/phone-latency-fast-ack-v90.test.mjs

      - name: Commit patch to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telephony/index.js tests/phone-fast-reaction-v2.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Diversify cached phone acknowledgements"
          git push origin HEAD:feat/phone-fast-reaction-v2
