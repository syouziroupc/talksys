name: Validate unified TalkSys TalkMan runtime

on:
  push:
    branches:
      - main
      - feature/unified-talkbot-v1
    paths:
      - discord-voice-smoke/src/build-talkman.mjs
      - discord-voice-smoke/src/build-talkman-runtime.mjs
      - discord-voice-smoke/src/build-talkman-runtime-r6.mjs
      - discord-voice-smoke/src/build-talkman-runtime-r7.mjs
      - discord-voice-smoke/start.ps1
      - discord-voice-smoke/start-utf8.ps1
      - discord-voice-smoke/update-and-start.ps1
      - discord-voice-smoke/update-and-start-utf8.ps1
      - src/voice-fast-reaction.js
      - tests/discord-talkman-builder.test.mjs
      - tests/discord-talkman-runtime-hardening.test.mjs
      - tests/discord-talkman-runtime-r6-log-control.test.mjs
      - tests/discord-talkman-runtime-r7-search-progress.test.mjs
      - tests/discord-update-launcher-v69.test.mjs
      - .github/workflows/validate-talkman-group.yml
      - discord-voice-smoke/src/index.mjs
  pull_request:
    paths:
      - discord-voice-smoke/src/build-talkman.mjs
      - discord-voice-smoke/src/build-talkman-runtime.mjs
      - discord-voice-smoke/src/build-talkman-runtime-r6.mjs
      - discord-voice-smoke/src/build-talkman-runtime-r7.mjs
      - discord-voice-smoke/start.ps1
      - discord-voice-smoke/start-utf8.ps1
      - discord-voice-smoke/update-and-start.ps1
      - discord-voice-smoke/update-and-start-utf8.ps1
      - src/voice-fast-reaction.js
      - tests/discord-talkman-builder.test.mjs
      - tests/discord-talkman-runtime-hardening.test.mjs
      - tests/discord-talkman-runtime-r6-log-control.test.mjs
      - tests/discord-talkman-runtime-r7-search-progress.test.mjs
      - tests/discord-update-launcher-v69.test.mjs
      - .github/workflows/validate-talkman-group.yml
      - discord-voice-smoke/src/index.mjs
  workflow_dispatch:

jobs:
  unified-discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check builder syntax
        run: |
          node --check discord-voice-smoke/src/build-talkman.mjs
          node --check discord-voice-smoke/src/build-talkman-runtime.mjs
          node --check discord-voice-smoke/src/build-talkman-runtime-r6.mjs
          node --check discord-voice-smoke/src/build-talkman-runtime-r7.mjs
      - name: Generate unified runtime
        run: node discord-voice-smoke/src/build-talkman-runtime-r7.mjs
      - name: Check generated runtime syntax
        run: node --check discord-voice-smoke/src/index-talkman.generated.mjs
      - name: Verify both slash commands and log controls exist in generated runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -F "name: 'talksys'" discord-voice-smoke/src/index-talkman.generated.mjs
          grep -F "name: 'talkman'" discord-voice-smoke/src/index-talkman.generated.mjs
          grep -F "name: 'logclear'" discord-voice-smoke/src/index-talkman.generated.mjs
          grep -F "interaction.commandName === 'talksys' || interaction.commandName === 'talkman'" discord-voice-smoke/src/index-talkman.generated.mjs
      - name: Run TalkMan and updater regression tests
        run: node --test tests/discord-talkman-builder.test.mjs tests/discord-talkman-runtime-hardening.test.mjs tests/discord-talkman-runtime-r6-log-control.test.mjs tests/discord-talkman-runtime-r7-search-progress.test.mjs tests/discord-update-launcher-v69.test.mjs
      - name: Parse unified PowerShell launchers
        shell: pwsh
        run: |
          $bootstrap = Get-Content -LiteralPath discord-voice-smoke/start.ps1 -Raw
          [void][scriptblock]::Create($bootstrap)
          if ($bootstrap -notmatch 'start-utf8\.ps1') { throw 'start.ps1 is not the compatibility bootstrap' }

          $launcher = Get-Content -LiteralPath discord-voice-smoke/start-utf8.ps1 -Raw
          [void][scriptblock]::Create($launcher)
          if ($launcher -notmatch 'build-talkman-runtime-r7\.mjs') { throw 'start implementation does not build R7 unified runtime' }
          if ($launcher -notmatch 'index-talkman\.generated\.mjs') { throw 'start implementation does not launch unified runtime' }

          $updaterBootstrap = Get-Content -LiteralPath discord-voice-smoke/update-and-start.ps1 -Raw
          [void][scriptblock]::Create($updaterBootstrap)
          if ($updaterBootstrap -notmatch 'update-and-start-utf8\.ps1') { throw 'update-and-start.ps1 is not the compatibility bootstrap' }

          $updater = Get-Content -LiteralPath discord-voice-smoke/update-and-start-utf8.ps1 -Raw
          [void][scriptblock]::Create($updater)
          if ($updater -notmatch 'src\\index\.mjs') { throw 'updater does not detect legacy runtime during cutover' }
          if ($updater -notmatch 'src\\index-talkman\.generated\.mjs') { throw 'updater does not detect unified runtime' }
          if ($updater -notmatch '\$unifiedEntryPattern') { throw 'updater does not match unified bridge processes' }
