name: Validate TalkSys

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: talksys-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate architecture registry
        run: npm run architecture:check
      - name: Check all source JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find src -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run full regression suite
        run: npm test
      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run
