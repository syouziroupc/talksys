name: Validate TalkSys

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check current JavaScript syntax
        run: |
          node --check src/search-probes-v44.js
          node --check src/search-v44.js
          node --check src/worker-v44.js
          node --check src/worker-v43-finalcandidate.js
          node --check src/worker-v43-reviewfix.js
          node --check tests/v44-deep-search-default.test.mjs
      - name: Run v44 targeted tests
        run: node --test tests/v44-deep-search-default.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run
