name: Validate TalkSys

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: talksys-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate architecture registry
        run: npm run architecture:check
      - name: Audit active production source graph
        run: npm run architecture:graph
      - name: Enforce reuse-first source changes
        env:
          TALKSYS_REUSE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run reuse:check
      - name: Check active and archived JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find src archive -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check discord-voice-smoke/src/index.mjs
      - name: Check PowerShell launcher syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'discord-voice-smoke/start.ps1',
            'discord-voice-smoke/update-and-start.ps1',
            'discord-voice-smoke/secret-store.ps1',
            'discord-voice-smoke/setup-bridge-secret.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell syntax validation failed: $file"
            }
            Write-Host "[ok] PowerShell syntax: $file"
          }
      - name: Run full regression suite
        run: npm test
      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run

  validate-windows-supervisor:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check PowerShell launcher syntax on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'discord-voice-smoke/start.ps1',
            'discord-voice-smoke/update-and-start.ps1',
            'discord-voice-smoke/secret-store.ps1',
            'discord-voice-smoke/setup-bridge-secret.ps1',
            'tests/supervisor-mutex-contention.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell syntax validation failed: $file"
            }
          }
      - name: Test supervisor mutex contention
        shell: pwsh
        run: ./tests/supervisor-mutex-contention.ps1
