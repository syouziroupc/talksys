name: Validate TalkSys

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: talksys-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate architecture registry
        run: npm run architecture:check
      - name: Audit active production source graph
        run: npm run architecture:graph
      - name: Enforce reuse-first source changes
        env:
          TALKSYS_REUSE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run reuse:check
      - name: Check active and archived JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find src archive -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run full regression suite
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/talksys-regression.log
      - name: Publish regression failure diagnostic
        if: steps.regression.outcome == 'failure' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo '<!-- talksys-v46-ci-diagnostic -->'
            echo 'V46 regression diagnostic (temporary):'
            echo '```text'
            tail -n 240 /tmp/talksys-regression.log
            echo '```'
          } > /tmp/talksys-ci-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST --raw-field body="$(cat /tmp/talksys-ci-comment.md)"
      - name: Fail after regression diagnostic
        if: steps.regression.outcome == 'failure'
        run: exit 1
      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run
