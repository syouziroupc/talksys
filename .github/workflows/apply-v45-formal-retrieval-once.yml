name: Apply formal retrieval v45 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v45-formal-retrieval-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply formal retrieval patch
        run: python scripts/apply-v45-formal-retrieval.py
      - name: Validate all runtime code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          find src -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run
      - name: Commit only validated runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name talksys-automation
          git config user.email actions@users.noreply.github.com
          git add src/search-v45.js src/direct-primary-v45.js src/worker-v44.js src/free-shopping-api-v45.js tests/v45-formal-retrieval.test.mjs
          git commit -m 'Replace broken RSS search with formal retrieval paths'
          git push origin HEAD:main
