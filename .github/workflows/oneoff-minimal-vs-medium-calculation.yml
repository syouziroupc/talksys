name: One-off minimal vs medium calculation
on:
  push:
    branches: [qa/expanded-ai-quality-prompt-audit-v1]
    paths:
      - 'scripts/experimental-minimal-vs-medium-calculation.mjs'
      - '.github/workflows/oneoff-minimal-vs-medium-calculation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AUDIT_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate experiment
        run: |
          set -euo pipefail
          node --check scripts/experimental-minimal-vs-medium-calculation.mjs
          test -n "${GEMINI_API_KEY:-}"
      - name: Run experiment
        run: node scripts/experimental-minimal-vs-medium-calculation.mjs
      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifacts/minimal-vs-medium-calculation/report.md ]]; then cat artifacts/minimal-vs-medium-calculation/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-vs-medium-calculation-report
          path: artifacts/minimal-vs-medium-calculation/
          retention-days: 30