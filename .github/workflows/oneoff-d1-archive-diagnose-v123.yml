name: One-off D1 archive diagnose v123

on:
  push:
    branches: [fix/d1-archive-v123]
    paths: ['.github/workflows/oneoff-d1-archive-diagnose-v123.yml']
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      LATENCY_HEALTH_URL: https://talksys-phone-latency-health.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Resolve Cloudflare Workers account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            account_id="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=1' | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.result?.[0]?.id||'')")"
            test -n "$account_id"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi
      - name: Deploy isolated phone latency health worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.phone-latency-health.jsonc
      - name: Read privacy-safe phone ACK latency summary
        shell: bash
        run: |
          set -euo pipefail
          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$LATENCY_HEALTH_URL/health" || true)"
            ok="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.ok===true))")"
            if [[ "$ok" == "true" ]]; then
              echo "$body"
              exit 0
            fi
            sleep 3
          done
          echo "$body"
          exit 1
      - name: Call signed archive endpoint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          token="$(node -e "const c=require('crypto');process.stdout.write(c.createHash('sha256').update(process.env.GEMINI_API_KEY+':talksys-tts-diagnostic-v1').digest('hex'))")"
          body_file="$(mktemp)"
          code="$(curl --silent --show-error --max-time 45 -X POST -o "$body_file" -w '%{http_code}' -H "x-talksys-diagnostic: $token" "$PRODUCTION_URL/api/internal/archive-conversation-logs" || true)"
          echo "HTTP=$code"
          cat "$body_file"
          echo
          rm -f "$body_file"
          [[ "$code" == "200" ]]