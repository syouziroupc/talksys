name: One-off D1 archive diagnose v123

on:
  push:
    branches: [fix/d1-archive-v123]
    paths: ['.github/workflows/oneoff-d1-archive-diagnose-v123.yml']
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Resolve Cloudflare account by D1 access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          accounts_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          mapfile -t account_ids < <(ACCOUNTS_JSON="$accounts_json" EXISTING_ID="${CLOUDFLARE_ACCOUNT_ID:-}" node <<'NODE'
          const d = JSON.parse(process.env.ACCOUNTS_JSON || '{}');
          const ids = [process.env.EXISTING_ID || '', ...(d.result || []).map((x) => x?.id || '')].filter(Boolean);
          process.stdout.write([...new Set(ids)].join('\n'));
          NODE
          )
          for account_id in "${account_ids[@]}"; do
            if CLOUDFLARE_ACCOUNT_ID="$account_id" npx wrangler d1 execute talksys-conversation-logs --remote --json --command "SELECT 1 AS ok;" >/tmp/d1-probe.json 2>/dev/null; then
              echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
              echo 'Resolved Cloudflare account by successful D1 probe.'
              rm -f /tmp/d1-probe.json
              exit 0
            fi
          done
          rm -f /tmp/d1-probe.json
          echo 'No accessible Cloudflare account could query the TalkSys D1 database.'
          exit 1
      - name: Summarize recent phone ACK latency without PII
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute talksys-conversation-logs --remote --json --command "SELECT turn_id, stage, elapsed_ms, created_at FROM phone_latency_events WHERE stage IN ('vad_finalize','stt_end','ack_cache_hit','ack_cache_miss','ack_first_pcmu') ORDER BY id DESC LIMIT 1000;" > phone-latency-raw.json
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('phone-latency-raw.json', 'utf8'));
          const blocks = Array.isArray(raw) ? raw : [raw];
          const rows = blocks.flatMap((block) => Array.isArray(block?.results) ? block.results : []);
          const turns = new Map();
          for (const row of rows) {
            const turnId = String(row?.turn_id || '');
            const stage = String(row?.stage || '');
            const elapsed = Number(row?.elapsed_ms);
            if (!turnId || !stage || !Number.isFinite(elapsed)) continue;
            const current = turns.get(turnId) || { createdAt: '', values: {}, cacheHit: false, cacheMiss: false };
            if (!current.createdAt || String(row?.created_at || '') > current.createdAt) current.createdAt = String(row?.created_at || '');
            if (stage === 'ack_cache_hit') current.cacheHit = true;
            else if (stage === 'ack_cache_miss') current.cacheMiss = true;
            else current.values[stage] = elapsed;
            turns.set(turnId, current);
          }
          const completed = [...turns.values()]
            .filter((turn) => Number.isFinite(turn.values.ack_first_pcmu))
            .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
          const ack = completed.map((turn) => turn.values.ack_first_pcmu).sort((a, b) => a - b);
          const percentile = (values, p) => {
            if (!values.length) return null;
            const index = Math.max(0, Math.min(values.length - 1, Math.ceil(values.length * p) - 1));
            return values[index];
          };
          const latest = completed[0] || null;
          const summary = {
            type: 'phone_ack_latency_summary',
            metric: 'estimated speech end to first outbound ACK PCMU frame',
            sampleCount: ack.length,
            latestAt: latest?.createdAt || null,
            latestAckFirstPcmuMs: latest?.values?.ack_first_pcmu ?? null,
            latestVadFinalizeMs: latest?.values?.vad_finalize ?? null,
            latestSttEndMs: latest?.values?.stt_end ?? null,
            latestAckCacheHit: latest?.cacheHit ?? null,
            latestAckCacheMiss: latest?.cacheMiss ?? null,
            p50AckFirstPcmuMs: percentile(ack, 0.50),
            p95AckFirstPcmuMs: percentile(ack, 0.95),
            maxAckFirstPcmuMs: ack.length ? ack[ack.length - 1] : null,
            recent: completed.slice(0, 10).map((turn) => ({
              observedAt: turn.createdAt || null,
              ackFirstPcmuMs: turn.values.ack_first_pcmu ?? null,
              vadFinalizeMs: turn.values.vad_finalize ?? null,
              sttEndMs: turn.values.stt_end ?? null,
              ackCacheHit: turn.cacheHit,
              ackCacheMiss: turn.cacheMiss
            }))
          };
          console.log(JSON.stringify(summary, null, 2));
          NODE
          rm -f phone-latency-raw.json
      - name: Inspect remote D1 schemas
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo '=== conversation_logs ==='
          npx wrangler d1 execute talksys-conversation-logs --remote --command "PRAGMA table_info(conversation_logs);"
          echo '=== conversation_logs_archive ==='
          npx wrangler d1 execute talksys-conversation-logs --remote --command "PRAGMA table_info(conversation_logs_archive);"
      - name: Call signed archive endpoint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          token="$(node -e "const c=require('crypto');process.stdout.write(c.createHash('sha256').update(process.env.GEMINI_API_KEY+':talksys-tts-diagnostic-v1').digest('hex'))")"
          body_file="$(mktemp)"
          code="$(curl --silent --show-error --max-time 45 -X POST -o "$body_file" -w '%{http_code}' -H "x-talksys-diagnostic: $token" "$PRODUCTION_URL/api/internal/archive-conversation-logs" || true)"
          echo "HTTP=$code"
          cat "$body_file"
          echo
          rm -f "$body_file"
          [[ "$code" == "200" ]]