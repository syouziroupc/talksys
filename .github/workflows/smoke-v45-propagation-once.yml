name: Smoke v45 production after propagation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-v45-propagation-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check production after propagation
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          call() { node -e 'process.stdout.write(JSON.stringify({text:process.argv[1],history:[]}))' "$1" | curl -fsS --max-time "$2" -H 'content-type: application/json' --data-binary @- "$URL/api/turn"; }
          out="$(call '3万円以下で動画視聴用の中古ノートPCを候補から比較して選んで' 30)"
          echo "COMPLEX=$out"
          OUT="$out" node - <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}'), x=d.searchDiagnostics||{};
          console.log(JSON.stringify({queries:d.queries,plannerTransport:x.plannerTransport,plannerError:x.plannerError,researchMode:x.researchMode,candidateType:x.candidateType,searchMs:d.timings?.searchMs,answer:d.answer}));
          NODE
          out="$(call 'MSI X79A-GD45の最新BIOSを公式で確認して' 25)"
          echo "BIOS=$out"
