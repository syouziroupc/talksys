name: Apply phone personalization runtime v116

on:
  push:
    branches: [feat/phone-personalization-runtime-v116]
    paths:
      - '.github/workflows/oneoff-phone-personalization-runtime-v116.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply v116 runtime patch
        run: python3 scripts/apply-phone-personalization-runtime-v116.py
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Syntax check
        run: |
          node --check src/telephony/index.js
          node --check src/integrated-entry.js
      - name: Focused personalization runtime tests
        run: node --test tests/phone-personalization-runtime-v116.test.mjs tests/phone-personalization-profile-v115.test.mjs tests/phone-greeting-latency-v114.test.mjs
      - name: Architecture checks
        run: |
          npm run architecture:check
          npm run architecture:graph
          npm run reuse:check
      - name: Full active test suite
        run: npm test
      - name: Worker dry run
        run: npx wrangler deploy --dry-run
      - name: Verify changed source scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD -- src tests | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/telephony/index\.js|src/integrated-entry\.js|tests/phone-personalization-runtime-v116\.test\.mjs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected source/test changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-phone-personalization-runtime-v116.py .github/workflows/oneoff-phone-personalization-runtime-v116.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/telephony/index.js src/integrated-entry.js tests/phone-personalization-runtime-v116.test.mjs scripts/apply-phone-personalization-runtime-v116.py .github/workflows/oneoff-phone-personalization-runtime-v116.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Use caller personalization in phone runtime v116'
          git push origin HEAD:feat/phone-personalization-runtime-v116
