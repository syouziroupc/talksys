name: Fix PR165 CI
on:
  push:
    branches: [v129-correct]
    paths:
      - 'scripts/fix-pr165-ci.py'
      - '.github/workflows/fix-pr165-ci.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v129-correct
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply isolated CI repair
        run: python3 scripts/fix-pr165-ci.py
      - name: Syntax check
        run: node --check src/integrated-entry.js
      - name: Full active regression suite
        run: npm test
      - name: Commit validated repair
        run: |
          git config user.name 'talksys-ci'
          git config user.email 'talksys-ci@users.noreply.github.com'
          git add src/integrated-entry.js \
            tests/discord-verifier-stream-v66.test.mjs \
            tests/voice-latency-invariants.test.mjs \
            tests/phone-input-adaptation-v127.test.mjs \
            tests/gemini-personalization-v55.test.mjs \
            tests/quality-first-v61.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No repair changes to commit'
          else
            git commit -m 'Repair v129 quality invariants and regression contracts'
            git push origin HEAD:v129-correct
          fi
