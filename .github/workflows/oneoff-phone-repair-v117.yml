name: One-off phone repair v117

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-phone-repair-v117.yml'

permissions:
  contents: write

concurrency:
  group: oneoff-phone-repair-v117
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply phone repair v117
        run: python scripts/oneoff_phone_repair_v117.py
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/telephony/index.js
          node --test tests/phone-repair-v117.test.mjs tests/phone-latency-fast-ack-v90.test.mjs tests/phone-fast-reaction-v2.test.mjs tests/phone-profile-preload-v116a.test.mjs
      - name: Full validation
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:check
          npm run architecture:graph
          npm run reuse:check
          npm test
          npx wrangler deploy --dry-run
      - name: Remove one-off helpers and verify scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneoff-phone-repair-v117.yml scripts/oneoff_phone_repair_v117.py
          git add -A
          changed="$(git diff --name-only c8a1aec52398d2db88981f13da8c7655e8baffae)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/telephony/index\.js|tests/phone-latency-fast-ack-v90\.test\.mjs|tests/phone-repair-v117\.test\.mjs)$' || true)"
          test -z "$unexpected"
      - name: Commit and push verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair phone acknowledgement ZIP and profile management v117'
          git push origin HEAD:main
