name: Diagnose TalkSys regression
on:
  push:
    branches: [main]
    paths:
      - '.diagnostics/regression-trigger.txt'
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Locate failing test file
        shell: bash
        run: |
          set +e
          failed=0
          for f in tests/*.test.mjs; do
            echo "=== TESTFILE $f ==="
            node --test "$f"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "=== FAILED_FILE $f ==="
              failed=1
            fi
          done
          exit $failed
