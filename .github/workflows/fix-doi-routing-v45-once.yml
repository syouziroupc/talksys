name: Fix DOI routing v45 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-doi-routing-v45-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply DOI routing fix
        run: python scripts/fix-doi-routing-v45.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          find src -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name talksys-automation
          git config user.email actions@users.noreply.github.com
          git add src/worker-v44.js tests/v45-doi-routing.test.mjs
          git commit -m 'Prevent DOI identifiers from entering arithmetic routing'
          git push origin HEAD:main
