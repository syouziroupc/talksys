name: Audit TalkSys search system once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-system-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Audit production search stack
        id: audit
        shell: bash
        run: |
          set -uo pipefail
          BASE='https://talksys.syouziroupc.workers.dev'
          failures=0
          mkdir -p audit

          turn() {
            local name="$1"
            local text="$2"
            local history_json="${3:-[]}"
            if ! jq -nc --arg text "$text" --argjson history "$history_json" '{text:$text,history:$history}' \
              | curl -fsS --retry 2 --retry-delay 1 -H 'content-type: application/json' --data-binary @- "$BASE/api/turn" \
              > "/tmp/${name}.json"; then
              printf '%s\n' '{"ok":false,"transportError":"curl_failed"}' > "/tmp/${name}.json"
            fi
          }

          if ! curl -fsS --retry 2 "$BASE/voice-health" > /tmp/health.json; then
            printf '%s\n' '{"ok":false,"transportError":"curl_failed"}' > /tmp/health.json
          fi

          if ! jq -e '.webRetrieval == true' /tmp/health.json >/dev/null; then failures=$((failures+1)); fi
          if ! jq -e '.generalWebSearchEnabled == true' /tmp/health.json >/dev/null; then failures=$((failures+1)); fi

          turn weather '別府市の今日の天気は？'
          if ! jq -e '.ok == true and .apiUsed == true and ([.apiSources[].tool] | index("jma_weather") != null)' /tmp/weather.json >/dev/null; then failures=$((failures+1)); fi

          turn fx '100米ドルは日本円でいくら？'
          if ! jq -e '.ok == true and .apiUsed == true and ([.apiSources[].tool] | index("frankfurter") != null)' /tmp/fx.json >/dev/null; then failures=$((failures+1)); fi

          turn gdp '日本の一人当たりGDPは？'
          if ! jq -e '.ok == true and .apiUsed == true and ([.apiSources[].tool] | index("world_bank_wdi") != null)' /tmp/gdp.json >/dev/null; then failures=$((failures+1)); fi

          turn current_web 'OpenAIの今日の最新ニュースを検索して、重要なものを2件だけ教えて'
          if ! jq -e '.ok == true and .search == true and .searchUseful == true and ((.sources // []) | length) >= 1' /tmp/current_web.json >/dev/null; then failures=$((failures+1)); fi

          turn firmware 'X79A-GD45の最新BIOSを公式情報から確認して'
          if ! jq -e '.ok == true and .search == true and .searchUseful == true and ((.sources // []) | length) >= 1' /tmp/firmware.json >/dev/null; then failures=$((failures+1)); fi

          history='[{"role":"user","content":"2万円以下で中古ノートPCを探して"},{"role":"assistant","content":"候補を確認します。"}]'
          turn context 'その中でもっと安いのある？' "$history"
          if ! jq -e '(.resolvedQuestion // "") | contains("中古ノートPC")' /tmp/context.json >/dev/null; then failures=$((failures+1)); fi

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson failures "$failures" \
            --slurpfile health /tmp/health.json \
            --slurpfile weather /tmp/weather.json \
            --slurpfile fx /tmp/fx.json \
            --slurpfile gdp /tmp/gdp.json \
            --slurpfile currentWeb /tmp/current_web.json \
            --slurpfile firmware /tmp/firmware.json \
            --slurpfile context /tmp/context.json \
            '{generatedAt:$generatedAt,failures:$failures,health:$health[0],tests:{weather:$weather[0],fx:$fx[0],gdp:$gdp[0],currentWeb:$currentWeb[0],firmware:$firmware[0],context:$context[0]}}' \
            > audit/search-system-audit-result.json

          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          jq '{generatedAt,failures,health:{revision:.health.revision,searchRevision:.health.searchRevision,webRetrieval:.health.webRetrieval,generalWebSearchEnabled:.health.generalWebSearchEnabled,generalWebSearchProvider:.health.generalWebSearchProvider,generalWebSearchDisabledReason:.health.generalWebSearchDisabledReason},tests:(.tests|with_entries(.value |= {ok,answer,route,apiUsed,apiIntents,apiSources,search,searchUseful,searchMode,resolvedQuestion,queries,sources,searchCoverage,searchDiagnostics,apiDiagnostics,timings}))}' audit/search-system-audit-result.json

      - name: Persist audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name talksys-search-audit
          git config user.email actions@users.noreply.github.com
          git add audit/search-system-audit-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record TalkSys search system audit result'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce audit result
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.audit.outputs.failures }}' != '0' ]; then
            echo 'Search-system audit found failures.'
            exit 1
          fi
