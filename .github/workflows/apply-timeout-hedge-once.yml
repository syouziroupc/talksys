name: Apply TalkSys timeout hedge once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-timeout-hedge-once.yml

permissions:
  contents: write

concurrency:
  group: talksys-timeout-hedge-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Patch timeout recovery without changing CPCV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/worker-v44.js')
          text = path.read_text(encoding='utf-8')

          old_constants = "const MODEL = '@cf/zai-org/glm-5.3-flash';\nconst MODEL_TIMEOUT_MS = 12000;"
          new_constants = "const MODEL = '@cf/zai-org/glm-5.3-flash';\nconst MODEL_FALLBACK = '@cf/zai-org/glm-4.7-flash';\nconst MODEL_TIMEOUT_MS = 12000;\nconst MODEL_HEDGE_DELAY_MS = 3500;"
          if old_constants not in text:
              raise SystemExit('expected model constants not found')
          text = text.replace(old_constants, new_constants, 1)

          start = text.index('async function runModel(')
          end = text.index('\nasync function casualTurn(', start)
          replacement = r'''async function runModel(env, messages, max = 520, temperature = 0.08, timeoutMs = MODEL_TIMEOUT_MS) {
            const started = Date.now();
            const budgetMs = Math.max(250, Number(timeoutMs) || MODEL_TIMEOUT_MS);
            const hedgeDelayMs = Math.min(MODEL_HEDGE_DELAY_MS, Math.max(50, Math.floor(budgetMs * 0.35)));
            const primaryController = new AbortController();
            const fallbackController = new AbortController();
            let hedgeTimer = null;
            let fallbackStarted = false;
            let resolveFallback;
            let rejectFallback;

            const modelArgs = {
              messages,
              stream: false,
              modalities: ['text'],
              max_completion_tokens: max,
              temperature,
              reasoning_effort: 'low',
            };

            const runOne = async (model, controller) => {
              const result = await env.AI.run(model, modelArgs, { signal: controller.signal });
              const value = readModelText(result);
              if (!value) throw new Error(`empty_model_answer:${model}`);
              return { text: value, model };
            };

            const fallback = new Promise((resolve, reject) => {
              resolveFallback = resolve;
              rejectFallback = reject;
            });
            const startFallback = () => {
              if (fallbackStarted) return;
              fallbackStarted = true;
              if (hedgeTimer) clearTimeout(hedgeTimer);
              Promise.resolve()
                .then(() => runOne(MODEL_FALLBACK, fallbackController))
                .then(resolveFallback, rejectFallback);
            };

            hedgeTimer = setTimeout(startFallback, hedgeDelayMs);
            const primary = Promise.resolve()
              .then(() => runOne(MODEL, primaryController))
              .catch((error) => {
                startFallback();
                throw error;
              });

            try {
              const winner = await boundedPromise(Promise.any([primary, fallback]), budgetMs, 'model');
              return {
                text: winner.text,
                ms: Date.now() - started,
                model: winner.model,
                fallbackUsed: winner.model === MODEL_FALLBACK,
              };
            } finally {
              if (hedgeTimer) clearTimeout(hedgeTimer);
              try { primaryController.abort(); } catch {}
              try { fallbackController.abort(); } catch {}
            }
          }
          '''
          text = text[:start] + replacement + text[end:]

          old_fallback = "return `回答生成がタイムアウトしたため、取得済みのWeb根拠だけを返します。${facts}`;"
          new_fallback = "return `取得済みのWeb根拠から確認できる範囲を返します。${facts}`;"
          if old_fallback not in text:
              raise SystemExit('expected grounded timeout fallback text not found')
          text = text.replace(old_fallback, new_fallback, 1)

          old_health = "        modelTimeoutMs: MODEL_TIMEOUT_MS,\n        modelTimeoutFallback: true,"
          new_health = "        modelTimeoutMs: MODEL_TIMEOUT_MS,\n        modelTimeoutFallback: true,\n        modelHedgeFallback: MODEL_FALLBACK,\n        modelHedgeDelayMs: MODEL_HEDGE_DELAY_MS,"
          if old_health not in text:
              raise SystemExit('expected health timeout fields not found')
          text = text.replace(old_health, new_health, 1)

          old_export = "  boundedPromise,\n  mechanicalGroundedAnswer,"
          new_export = "  boundedPromise,\n  runModel,\n  mechanicalGroundedAnswer,"
          if old_export not in text:
              raise SystemExit('expected __test export block not found')
          text = text.replace(old_export, new_export, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/v47-model-hedge.test.mjs')
          test_path.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { __test as worker } from '../src/worker-v44.js';

          test('slow primary model is hedged to the known fast fallback before the hard timeout', async () => {
            const calls = [];
            const env = {
              AI: {
                run(model) {
                  calls.push(model);
                  if (model === '@cf/zai-org/glm-5.3-flash') return new Promise(() => {});
                  if (model === '@cf/zai-org/glm-4.7-flash') return Promise.resolve({ response: 'フォールバック成功' });
                  throw new Error(`unexpected model ${model}`);
                },
              },
            };
            const started = Date.now();
            const result = await worker.runModel(env, [{ role: 'user', content: 'こんにちは' }], 32, 0.1, 220);
            assert.equal(result.text, 'フォールバック成功');
            assert.equal(result.model, '@cf/zai-org/glm-4.7-flash');
            assert.equal(result.fallbackUsed, true);
            assert.ok(calls.includes('@cf/zai-org/glm-5.3-flash'));
            assert.ok(calls.includes('@cf/zai-org/glm-4.7-flash'));
            assert.ok(Date.now() - started < 1000);
          });

          test('fast primary model wins without starting the fallback', async () => {
            const calls = [];
            const env = {
              AI: {
                run(model) {
                  calls.push(model);
                  return Promise.resolve({ response: 'primary success' });
                },
              },
            };
            const result = await worker.runModel(env, [{ role: 'user', content: 'test' }], 32, 0.1, 220);
            assert.equal(result.text, 'primary success');
            assert.equal(result.model, '@cf/zai-org/glm-5.3-flash');
            assert.equal(result.fallbackUsed, false);
            assert.deepEqual(calls, ['@cf/zai-org/glm-5.3-flash']);
          });
          ''', encoding='utf-8')
          PY
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate timeout fix
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker-v44.js
          node --test tests/v45-model-timeout.test.mjs tests/v47-model-hedge.test.mjs
          npm run architecture:check
          npm run architecture:graph
          npm test
          npx wrangler deploy --dry-run
      - name: Commit validated TalkSys-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'talksys-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worker-v44.js tests/v47-model-hedge.test.mjs
          git rm .github/workflows/apply-timeout-hedge-once.yml
          git commit -m 'Fix TalkSys model timeout with hedged fallback'
          git push origin HEAD:main
