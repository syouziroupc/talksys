name: Repair TalkSys v45 search once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-search-v45-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply v45 search repair
        run: node scripts/repair-search-v45-thorough.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/search-v45.js
          node --check src/direct-primary-v45.js
          node --check src/worker-v44.js
          node --check tests/v45-search-restoration.test.mjs
          npm test
          npx wrangler deploy --dry-run

      - name: Static search contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -F "SEARCH_V45_GENERAL_WEB_SEARCH_ENABLED = true" src/search-v45.js
          grep -F "searchProbe" src/search-v45.js
          grep -F "duckduckgo" src/search-v45.js
          grep -F "google-news" src/search-v45.js
          grep -F "rotating-multi-engine-v45" src/worker-v44.js
          ! grep -F "general-web-search-disabled" src/search-v45.js

      - name: Commit repaired search runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name talksys-automation
          git config user.email actions@users.noreply.github.com
          git add src/search-v45.js src/direct-primary-v45.js src/worker-v44.js tests/v45-search-restoration.test.mjs
          if git diff --cached --quiet; then
            echo 'Search repair already current.'
            exit 0
          fi
          git commit -m 'Restore robust multi-engine search in TalkSys v45'
          git pull --rebase origin main
          git push origin HEAD:main
