name: Diagnose active tests PR143

on:
  push:
    branches: [phone-latency-fast-ack-v90]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies once
        run: npm ci --no-audit --no-fund
      - name: Run each active test and capture failures
        shell: bash
        run: |
          set -uo pipefail
          : > diagnostic-results.txt
          failed=0
          node <<'NODE' > active-tests.txt
          const fs = require('fs');
          const legacy = new Set([
            'discord-fast-ack-echo-v81.test.mjs',
            'discord-gateway-ready-v106.test.mjs',
            'discord-persistent-stt-v67.test.mjs',
            'discord-stt-correction-barge-v88.test.mjs',
            'discord-voice-smoke.test.mjs',
            'discord-web-adapter-v106.test.mjs',
            'discord-web-audio-adapter-v79.test.mjs',
            'discord-web-parity-v107.test.mjs',
          ]);
          for (const name of fs.readdirSync('tests').filter((name) => name.endsWith('.test.mjs') && !legacy.has(name)).sort()) {
            console.log(`tests/${name}`);
          }
          NODE
          while IFS= read -r testfile; do
            if ! node --test "$testfile" > one-test.log 2>&1; then
              failed=1
              {
                echo "===== $testfile ====="
                cat one-test.log
                echo
              } >> diagnostic-results.txt
            fi
          done < active-tests.txt
          if [[ $failed -eq 0 ]]; then
            echo "ALL_ACTIVE_TESTS_PASSED" > diagnostic-results.txt
          fi
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr143-test-diagnostics
          path: diagnostic-results.txt
          if-no-files-found: error
