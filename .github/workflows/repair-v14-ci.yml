name: Repair v14.1 Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair live client syntax
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/cloudflare-live-client.js')
          source = path.read_text(encoding='utf-8')
          broken = ".replace(/[*_#>`~]/g, '')"
          fixed = ".replace(/[*_#>\\x60~]/g, '')"
          if broken in source:
              source = source.replace(broken, fixed)
              path.write_text(source, encoding='utf-8')
          PY

          node --check src/cloudflare-live-client.js
          git diff --check

          if git diff --quiet; then
            echo "Nothing to repair."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloudflare-live-client.js
          git commit -m "Repair v14.1 live client syntax"
          git push
