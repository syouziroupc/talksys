name: Repair v14.1 Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair v14.1 source regressions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          live_path = Path('src/cloudflare-live-client.js')
          live = live_path.read_text(encoding='utf-8')
          broken = ".replace(/[*_#>`~]/g, '')"
          fixed = ".replace(/[*_#>\\x60~]/g, '')"
          if broken in live:
              live_path.write_text(live.replace(broken, fixed), encoding='utf-8')

          web_path = Path('src/web-search.js')
          web = web_path.read_text(encoding='utf-8')
          replacement = r'''function stripHtml(value) {
            return decodeEntities(String(value || ''))
              .replace(/<script\b[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[\s\S]*?<\/style>/gi, ' ')
              .replace(/<svg\b[\s\S]*?<\/svg>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
          }

          function readTag'''
          patched, count = re.subn(
              r"function stripHtml\(value\) \{[\s\S]*?\n\}\n\nfunction readTag",
              lambda _match: replacement,
              web,
              count=1,
          )
          if count != 1:
              raise SystemExit('stripHtml function not found')
          if patched != web:
              web_path.write_text(patched, encoding='utf-8')
          PY

          node --check src/cloudflare-live-client.js
          node --check src/web-search.js
          node --test tests/web-search.test.mjs
          git diff --check

          if git diff --quiet; then
            echo "Nothing to repair."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloudflare-live-client.js src/web-search.js
          git commit -m "Repair v14.1 source regressions"
          git push
