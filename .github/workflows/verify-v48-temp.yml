name: Verify TalkSys v48 production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v48-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify typed interruption and faster voice client
        run: |
          set -euo pipefail
          client="$(curl -fsS --max-time 20 https://talksys.syouziroupc.workers.dev/talk-v45.js)"
          grep -F '非常文字入力で現在の応答を割込み' <<< "$client"
          grep -F 'u.rate=1.12' <<< "$client"
          grep -F 'SILENCE_MS=620' <<< "$client"
          if grep -F 'if(!v||busy)return' <<< "$client"; then
            echo 'old typed-input busy guard is still live'
            exit 1
          fi

      - name: Verify direct current transit answer
        run: |
          set -euo pipefail
          payload='{"text":"大分駅から別府駅へ向かう次の電車は何時？","history":[]}'
          out="$(curl -fsS --max-time 75 -H 'content-type: application/json' --data "$payload" https://talksys.syouziroupc.workers.dev/api/turn)"
          OUT="$out" node - <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}');
          const a=String(d.answer||'');
          const engines=(d.sources||[]).map(x=>x.engine);
          const directEngines=new Set(['jrkyushu-official-timetable-current','yahoo-transit-direct-current']);
          if (!d.ok) throw new Error('not ok: '+process.env.OUT);
          if (d.route!=='direct-transit-v48') throw new Error('wrong route: '+process.env.OUT);
          if (!d.directTransitPrimary) throw new Error('direct transit not active: '+process.env.OUT);
          if (!engines.some(x=>directEngines.has(x))) throw new Error('direct transit source missing: '+process.env.OUT);
          if (d.truthGate?.structuredTransitAuthorized!==true) throw new Error('truth gate did not authorize route evidence: '+process.env.OUT);
          if (/私は.*(?:Gemini|Google)|Googleが開発したAIモデル/i.test(a)) throw new Error('provider self-identification leaked: '+a);
          if (!/(?:\d{1,2}:\d{2}|\d{1,2}時\d{1,2}分|発)/.test(a)) throw new Error('no concrete departure information: '+a);
          console.log(JSON.stringify({route:d.route,directTransitEngine:d.directTransitEngine,answer:a,sources:d.sources,timings:d.timings,truthGate:d.truthGate}));
          NODE
