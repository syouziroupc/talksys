name: Apply v18.4 bounded precision search once

on:
  push:
    branches: [fix/v18-4-bounded-precision-search]
    paths:
      - '.github/workflows/v18-4-bounded-search-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v18-4-bounded-precision-search
          fetch-depth: 0
      - name: Apply v18.4 search repair
        run: python scripts/patch_v18_4_bounded_search.py
      - name: Commit runtime and regression tests
        run: |
          git config user.name talksys-ci
          git config user.email talksys-ci@users.noreply.github.com
          git add src/cloudflare-llm.js src/search-rerank.js src/search-orchestrator.js src/search-answer-v18.js src/worker-v14.js tests/voice-llm-contract.test.mjs tests/gemini-live-contract.test.mjs tests/search-budget-regression.test.mjs
          git commit -m "v18.4: bound precision search latency without slowing normal chat"
          git push origin HEAD:fix/v18-4-bounded-precision-search
