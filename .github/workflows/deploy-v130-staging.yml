name: Deploy TalkSys V130 staging

on:
  workflow_dispatch:
  push:
    branches: [v130]

permissions:
  contents: read

concurrency:
  group: talksys-v130-staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STAGING_D1_NAME: talksys-conversation-logs-staging
      STAGING_WORKER_NAME: talksys-staging
      PRODUCTION_D1_ID: 4d40b1c6-2436-4c5f-bb0a-e8e173a6d91a
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restrict staging workflow to V130
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/v130" ]]; then
            echo "V130 staging deploy is restricted to refs/heads/v130; got $GITHUB_REF"
            exit 1
          fi

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            account_id="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              https://api.cloudflare.com/client/v4/accounts?per_page=1 | \
              node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.result?.[0]?.id||'')")"
            test -n "$account_id"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Run repository validation before staging mutation
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:check
          npm run architecture:graph
          find src archive -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run

      - name: Resolve or create dedicated staging D1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx wrangler d1 list --json | node -e '
              const fs=require("fs");
              const name=process.env.STAGING_D1_NAME;
              const rows=JSON.parse(fs.readFileSync(0,"utf8"));
              const hit=(Array.isArray(rows)?rows:[]).find((row)=>row?.name===name);
              process.stdout.write(hit?.uuid||hit?.id||"");
            '
          }
          staging_id="$(list_db)"
          if [[ -z "$staging_id" ]]; then
            npx wrangler d1 create "$STAGING_D1_NAME"
            staging_id="$(list_db)"
          fi
          test -n "$staging_id"
          if [[ "$staging_id" == "$PRODUCTION_D1_ID" ]]; then
            echo 'Refusing staging deployment: staging D1 resolved to production D1.'
            exit 1
          fi
          echo "STAGING_D1_ID=$staging_id" >> "$GITHUB_ENV"
          echo "Resolved isolated staging D1: $STAGING_D1_NAME"

      - name: Build staging-only Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          let text = fs.readFileSync('wrangler.jsonc', 'utf8');
          const stagingId = process.env.STAGING_D1_ID;
          if (!stagingId) throw new Error('STAGING_D1_ID missing');
          text = text.replace('"name": "talksys"', `"name": "${process.env.STAGING_WORKER_NAME}"`);
          text = text.replace('"TELEPHONY_ENABLED": "true"', '"TELEPHONY_ENABLED": "false"');
          text = text.replace('"PHONE_MEMORY_ENABLED": "true"', '"PHONE_MEMORY_ENABLED": "false"');
          text = text.replace('"crons": ["15 18 * * *"]', '"crons": []');
          text = text.replace('"database_name": "talksys-conversation-logs"', `"database_name": "${process.env.STAGING_D1_NAME}"`);
          text = text.replace('"database_id": "4d40b1c6-2436-4c5f-bb0a-e8e173a6d91a"', `"database_id": "${stagingId}"`);
          if (text.includes('4d40b1c6-2436-4c5f-bb0a-e8e173a6d91a')) throw new Error('production D1 ID leaked into staging config');
          fs.writeFileSync('.wrangler-v130-staging.jsonc', text);
          NODE
          grep -q '"name": "talksys-staging"' .wrangler-v130-staging.jsonc
          grep -q "\"database_id\": \"$STAGING_D1_ID\"" .wrangler-v130-staging.jsonc
          ! grep -q "$PRODUCTION_D1_ID" .wrangler-v130-staging.jsonc

      - name: Apply V130 migrations to staging D1 only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply TALKSYS_LOG_DB --remote --config .wrangler-v130-staging.jsonc

      - name: Deploy staging Worker
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            secrets_file="$(mktemp)"
            trap 'rm -f "$secrets_file"' EXIT
            SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify({ GEMINI_API_KEY: process.env.GEMINI_API_KEY }));
          NODE
            npx wrangler deploy --config .wrangler-v130-staging.jsonc --secrets-file "$secrets_file"
          else
            npx wrangler deploy --config .wrangler-v130-staging.jsonc
          fi

      - name: Verify staging deployment is not production-bound
        shell: bash
        run: |
          set -euo pipefail
          deployed="$(npx wrangler versions list --name "$STAGING_WORKER_NAME" --json | head -c 200000)"
          test -n "$deployed"
          echo "V130 staging deployed with dedicated D1 $STAGING_D1_ID"
