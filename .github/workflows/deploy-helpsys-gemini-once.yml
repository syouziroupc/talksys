name: Deploy HelpSys Gemini once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-helpsys-gemini-once.yml

permissions:
  contents: read

jobs:
  deploy-helpsys:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PRODUCTION_URL: https://helpsys.syouziroupc.workers.dev
    steps:
      - name: Checkout original HelpSys Outlaw r3.8 production source
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/helpsys
          ref: a14c58f92fa004640e8378d8836122dfde9fafa9
          path: helpsys

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${GEMINI_API_KEY:-}"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            account_id="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              https://api.cloudflare.com/client/v4/accounts?per_page=1 | \
              node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.result?.[0]?.id||'')")"
            test -n "$account_id"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi

      - name: Patch only Gemini JSON Schema adapter
        working-directory: helpsys
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'worker/outlaw-guide.js';
          let s = fs.readFileSync(p, 'utf8');
          const before = 'responseSchema: tool.parameters';
          const after = 'responseJsonSchema: tool.parameters';
          if (!s.includes(before)) throw new Error('expected Outlaw Gemini responseSchema adapter not found');
          s = s.replace(before, after);
          fs.writeFileSync(p, s);
          NODE
          node --check worker/outlaw-guide.js
          git diff --check
          git diff -- worker/outlaw-guide.js

      - name: Install and validate original Outlaw Worker
        working-directory: helpsys
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          node --check worker/stable-gemini.js
          node --check worker/education-gemini.js
          node --check worker/outlaw-guide.js
          node --check worker/stable-router.js
          node tests/outlaw-worker-grounding-contract.mjs
          npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Restore original Outlaw r3.8 Worker architecture
        working-directory: helpsys
        shell: bash
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Put Gemini secret on restored HelpSys Worker
        working-directory: helpsys
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.jsonc

      - name: Verify original Outlaw health contract and Gemini configuration
        shell: bash
        run: |
          set -euo pipefail
          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/health/outlaw" || true)"
            ok="$(BODY="$body" node - <<'NODE'
          let d={}; try { d=JSON.parse(process.env.BODY||'{}'); } catch {}
          const ok=d.ok===true && d.service==='helpsys-outlaw' && d.version==='outlaw-2026.09.27-r3.8'
            && d.geminiModel==='gemini-3.8-flash' && d.geminiConfigured===true
            && d.aiConfigured===true && d.independentVisionReview===true
            && d.visualCoordinateSpace==='image_px' && d.geometryConsensus===true
            && d.visualConsensusField===true && Array.isArray(d.providers)
            && ['auto','gemini','glm'].every(x=>d.providers.includes(x));
          process.stdout.write(String(ok));
          NODE
            )"
            [[ "$ok" == "true" ]] && break
            [[ "$attempt" -eq 20 ]] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"

      - name: Probe Gemini API directly
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 -o "$body_file" -w '%{http_code}' \
            -X POST 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent' \
            -H 'content-type: application/json' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            --data '{"contents":[{"role":"user","parts":[{"text":"Reply with OK only."}]}],"generationConfig":{"maxOutputTokens":64,"thinkingConfig":{"thinkingLevel":"low"}}}' || true)"
          echo "Gemini direct HTTP=$status"
          cat "$body_file"
          echo
          [[ "$status" == "200" ]]

      - name: Smoke strict Gemini on original Outlaw planner
        shell: bash
        run: |
          set -euo pipefail
          payload='{"request":"設定を開く次の操作を案内して","aiProvider":"gemini","history":[],"systemContext":{"foregroundProcess":"explorer","foregroundTitle":"デスクトップ","foregroundProcessId":1234,"taskbarVisible":true,"runningApps":["explorer"],"browser":null},"evidence":{"screenshotPresent":false},"elements":[{"id":"u1","name":"スタート","automationId":"Start","className":"","controlType":"Button","processName":"explorer","interactable":true,"enabled":true,"keyboardFocusable":true,"focused":false,"password":false,"processId":1234,"value":null,"toggleState":null,"selected":null,"expandCollapseState":null,"x":0,"y":0,"width":80,"height":40}]}'
          out="$(curl -fsS --max-time 60 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/v1/outlaw-plan")"
          echo "$out"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!['target','clarify','done','not_found'].includes(String(d?.status||'')))throw new Error(process.env.OUT);console.log('strict Gemini OK status='+d.status);"

      - name: Verify original GLM route still alive
        shell: bash
        run: |
          set -euo pipefail
          payload='{"request":"設定を開く次の操作を案内して","aiProvider":"glm","history":[],"systemContext":{"foregroundProcess":"explorer","foregroundTitle":"デスクトップ","foregroundProcessId":1234,"taskbarVisible":true,"runningApps":["explorer"],"browser":null},"evidence":{"screenshotPresent":false},"elements":[{"id":"u1","name":"スタート","automationId":"Start","className":"","controlType":"Button","processName":"explorer","interactable":true,"enabled":true,"keyboardFocusable":true,"focused":false,"password":false,"processId":1234,"value":null,"toggleState":null,"selected":null,"expandCollapseState":null,"x":0,"y":0,"width":80,"height":40}]}'
          out="$(curl -fsS --max-time 60 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/v1/outlaw-plan")"
          echo "$out"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!['target','clarify','done','not_found'].includes(String(d?.status||'')))throw new Error(process.env.OUT);console.log('strict GLM OK status='+d.status);"

      - name: Verify stable router auxiliary routes
        shell: bash
        run: |
          set -euo pipefail
          site="$(curl -fsS --max-time 20 "$PRODUCTION_URL/health/site")"
          SITE="$site" node -e "const d=JSON.parse(process.env.SITE||'{}');if(d.ok!==true||d.service!=='helpsys-site')throw new Error(process.env.SITE);console.log(process.env.SITE);"
          code="$(curl --silent --show-error --max-time 20 -o /tmp/transcribe-body -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$PRODUCTION_URL/v1/transcribe" || true)"
          echo "transcribe probe HTTP=$code"
          [[ "$code" == "415" ]]
