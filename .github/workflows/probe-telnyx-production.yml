name: Probe TalkSys Telnyx production

on:
  push:
    branches: [main]
    paths:
      - '.telnyx/probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Inspect production secret names safely
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --format json)"
          SECRETS_JSON="$secrets_json" node <<'NODE'
          const rows = JSON.parse(process.env.SECRETS_JSON || '[]');
          const names = new Set(Array.isArray(rows) ? rows.map((r) => r?.name).filter(Boolean) : []);
          const telnyxNames = ['TELNYX_API_KEY','TELNYX_TOKEN','TELNYX_API_V2_KEY'].filter((n) => names.has(n));
          console.log(JSON.stringify({
            telephonySharedTokenConfigured: names.has('TELEPHONY_SHARED_TOKEN'),
            telephonyAdminTokenConfigured: names.has('TELEPHONY_ADMIN_TOKEN'),
            telnyxCredentialNamesPresent: telnyxNames,
            discordBridgeTokenConfigured: names.has('DISCORD_BRIDGE_TOKEN'),
            geminiApiKeyConfigured: names.has('GEMINI_API_KEY')
          }, null, 2));
          NODE
      - name: Probe production telephony health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 "$PRODUCTION_URL/telephony-health")"
          echo "$health"
          HEALTH="$health" node <<'NODE'
          const d = JSON.parse(process.env.HEALTH || '{}');
          if (d.ok !== true || d.enabled !== true || d.webhookTokenConfigured !== true || d.talksysTurnConnected !== true) {
            throw new Error('Telephony production health contract is not ready');
          }
          NODE
      - name: Verify unauthenticated voice endpoint is protected
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' -X POST "$PRODUCTION_URL/telnyx/voice")"
          [[ "$code" == "401" ]]
          grep -F 'unauthorized' "$body" >/dev/null
          echo 'Telnyx voice endpoint is live and token-protected.'
