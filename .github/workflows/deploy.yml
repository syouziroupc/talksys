name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v25-glm-mobile-audio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check src/worker-v25-production.js
          node --check src/worker-v25.js
          node --check src/glm-conversation-v25.js
          node --check src/cloudflare-live-client-v25.js
          node --check src/worker-v24-production.js
          node --check src/worker-v24.js
          node --check src/cloudflare-live-client-v24.js
          node --check src/search-v23.js
          node --check src/search-v22.js
          node --check src/grounding-policy-v22.js
          node --check src/bounded-conversation.js
          node --check src/conversation-memory.js
          node --check src/web-search.js
          node --check src/search-fallbacks.js

      - name: Run tests
        run: npm test

      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run

      - name: Probe production before deployment
        run: |
          set +e
          body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};console.log('Current production voiceRevision:',d.voiceRevision||'(missing)')"
          else
            echo "::warning::Production /voice-health is unreachable before deployment."
          fi

      - name: Deploy through GitHub Actions when Cloudflare credentials are configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report external deployment path when Actions credentials are absent
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Repository Cloudflare credentials are absent."
          echo "Production must be deployed through the authorized external production path."
          echo "This job will fail unless production actually reaches v25."

      - name: Verify production v25 contract
        run: |
          expected="$EXPECTED_VOICE_REVISION"
          body=""
          for attempt in $(seq 1 18); do
            set +e
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
              echo "Production voiceRevision: ${current:-missing}"
              if [ "$current" = "$expected" ]; then break; fi
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error::Production did not reach $expected. Deployment is NOT complete."
              exit 1
            fi
            sleep 10
          done

          BODY="$body" EXPECTED="$expected" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          const expected = process.env.EXPECTED;
          console.log(JSON.stringify({
            voiceRevision: d.voiceRevision,
            conversationOrchestrator: d.conversationOrchestrator,
            conversationModel: d.conversationModel,
            glmOnlyConversation: d.glmOnlyConversation,
            glmReasoningEffort: d.glmReasoningEffort,
            mobileAudioPipelineV25: d.mobileAudioPipelineV25,
            dedicatedCaptureAudioContext: d.dedicatedCaptureAudioContext,
            androidScriptProcessorPreferred: d.androidScriptProcessorPreferred,
            androidCallStartsAfterFirstMicFrame: d.androidCallStartsAfterFirstMicFrame,
            nativeMobileCaptureSampleRate: d.nativeMobileCaptureSampleRate,
            microphoneDiagnostics: d.microphoneDiagnostics,
          }));
          if (d.voiceRevision !== expected) throw new Error(`expected ${expected}, got ${d.voiceRevision}`);
          if (d.conversationModel !== '@cf/zai-org/glm-5.3-flash') throw new Error('GLM-5.3 Flash is not the active conversation model');
          if (d.conversationModelFallback !== '@cf/zai-org/glm-5.3-flash') throw new Error('non-GLM conversation fallback is still configured');
          if (d.glmReasoningEffort !== 'low') throw new Error('GLM low reasoning is not active');
          const required = [
            'glmOnlyConversation','conciseRepliesByDefault','mobileAudioPipelineV25','dedicatedCaptureAudioContext',
            'androidScriptProcessorPreferred','androidCallStartsAfterFirstMicFrame','nativeMobileCaptureSampleRate','microphoneDiagnostics',
            'browserStreamingTts','browserStreamingTtsStartsAtFirstSentence','preListeningMicFrames','voiceBargeIn',
            'contextualSearchSubjectOnlyCarryover'
          ];
          for (const key of required) if (d[key] !== true) throw new Error(`${key} is not true`);
          NODE

      - name: Verify live v25 client
        run: |
          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/cloudflare-live.js")"
          grep -F "captureAudioContext" <<< "$script"
          grep -F "IS_ANDROID" <<< "$script"
          grep -F "micFrameCount < 1" <<< "$script"
          grep -F "__talksysVoiceDebug" <<< "$script"
          grep -F "talksys-mic-stalled" <<< "$script"
          grep -F "callStartPending" <<< "$script"
          grep -F "talksys-barge-in" <<< "$script"
          grep -F "queueCompletedStreamSpeech(streamText, false)" <<< "$script"

      - name: Verify contextual search regression
        run: |
          body="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v25-context")"
          echo "$body"
          BODY="$body" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error('context smoke returned no evidence');
          const q = String(d.resolvedQuestion || '');
          if (!/パソコン/.test(q) || !/中古/.test(q) || !/横浜/.test(q)) throw new Error(`context not preserved: ${q}`);
          if (/YouTube|ネットサーフィン/i.test(q)) throw new Error(`old usage polluted current search: ${q}`);
          NODE
