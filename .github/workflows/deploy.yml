name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v28-simple-qwen-android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Validate v28 production path
        run: |
          node --check src/worker-v28-production.js
          node --check src/worker-v28.js
          node --check src/qwen-conversation-v28.js
          node --check src/cloudflare-live-client-v26.js
          node --check src/search-v26.js
          node --check src/conversation-memory.js
          npm test
          npx wrangler deploy --dry-run

      - name: Deploy when repository Cloudflare credentials exist
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Note external production path
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Repository credentials are absent; validated SHA will be deployed by the authorized production workflow."

      - name: Verify production contract after direct deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          body=""
          for attempt in $(seq 1 15); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            [ "$current" = "$EXPECTED_VOICE_REVISION" ] && break
            [ "$attempt" -eq 15 ] && { echo "::error::Production revision mismatch"; exit 1; }
            sleep 3
          done
          BODY="$body" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (d.voiceRevision !== 'cloudflare-agent-v28-simple-qwen-android') throw new Error('v28 revision missing');
          if (d.conversationModel !== '@cf/qwen/qwen3.8-27b') throw new Error('Qwen is not the single conversation model');
          if (d.conversationModelFallback !== null || d.conversationEmergencyFallback !== null) throw new Error('multi-model fallback still active');
          if (d.multiModelFallback !== false || d.sameModelRetryOnce !== true) throw new Error('retry contract mismatch');
          if (d.searchAnswerModel !== '@cf/qwen/qwen3.8-27b') throw new Error('search answer model mismatch');
          if (d.ttsPrimary !== '@cf/myshell-ai/melotts') throw new Error('MeloTTS mismatch');
          for (const key of ['mobileAudioPipelineV26','androidAudioWorkletPreferred','androidScriptProcessorFallback','androidPcmFrameProbeBeforeCall','androidCaptureBackendFailover','androidLifecycleResume','mobileWebSocketHardRecovery','microphoneDiagnostics','inFlightUserContext','directTransitEvidenceFallback']) {
            if (d[key] !== true) throw new Error(`${key} missing`);
          }
          NODE

      - name: Verify live Android client after direct deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/cloudflare-live.js")"
          grep -F "verifyAndroidCapturePipeline" <<< "$script"
          grep -F "talksys-mic-no-frames" <<< "$script"
          grep -F "resumeMobileRuntime" <<< "$script"
          grep -F "callStartPending" <<< "$script"
          grep -F "talksys-barge-in" <<< "$script"
