name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v22-grounding-by-default
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/worker-v14.js
          node --check src/worker-v19.js
          node --check src/worker-v20.js
          node --check src/worker-v21.js
          node --check src/worker-v22.js
          node --check src/search-tool-v20.js
          node --check src/search-v21.js
          node --check src/search-v22.js
          node --check src/grounding-policy-v22.js
          node --check src/cloudflare-live-client-v21.js
          node --check src/cloudflare-live-client.js
          node --check src/cloudflare-japanese-stt.js
          node --check src/cloudflare-japanese-tts.js
          node --check src/cloudflare-llm.js
          node --check src/bounded-conversation.js
          node --check src/conversation-memory.js
          node --check src/search-answer-v18.js
          node --check src/web-search.js
          node --check src/search-rerank.js
          node --check src/search-orchestrator.js
          node --check src/search-fallbacks.js
          node --check src/streaming-workers-ai.js
          node --check src/voice-helpers.js
          node --check desktop/main.cjs

      - name: Run tests
        run: npm test

      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run

      - name: Install screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: Render phone consultation UI screenshots
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/index.js', 'utf8');
          const match = source.match(/const HTML = `([\s\S]*?)`;\n\nfunction json/);
          if (!match) throw new Error('HTML template not found');
          fs.writeFileSync('/tmp/talksys.html', match[1]);
          NODE
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,900 --screenshot=web-desktop.png file:///tmp/talksys.html
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=web-mobile.png file:///tmp/talksys.html

      - uses: actions/upload-artifact@v7
        with:
          name: phone-ui-screenshots
          path: |
            web-desktop.png
            web-mobile.png

      - name: Probe production before deployment
        run: |
          set +e
          body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Production /voice-health is unreachable before deployment."
          else
            BODY="$body" node <<'NODE'
          let data = {};
          try { data = JSON.parse(process.env.BODY || '{}'); } catch {}
          console.log('Current production voiceRevision:', data.voiceRevision || '(missing)');
          NODE
          fi

      - name: Deploy to Cloudflare when repository credentials are configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production v22 grounding contract when deployment credentials are configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          body="$(curl -fsS --max-time 30 "$PRODUCTION_URL/voice-health")" || {
            echo "::error::Production /voice-health is unreachable."
            exit 1
          }
          BODY="$body" EXPECTED="$EXPECTED_VOICE_REVISION" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          const expected = process.env.EXPECTED;
          console.log(JSON.stringify({
            voiceRevision: d.voiceRevision,
            conversationPersistence: d.conversationPersistence,
            crossTurnContext: d.crossTurnContext,
            conversationOrchestrator: d.conversationOrchestrator,
            toolCalling: d.toolCalling,
            webSearchTool: d.webSearchTool,
            groundingPolicy: d.groundingPolicy,
            groundingByDefault: d.groundingByDefault,
            factualQuestionsSearchByDefault: d.factualQuestionsSearchByDefault,
            nonSearchRouteExternalFactAssertionsForbidden: d.nonSearchRouteExternalFactAssertionsForbidden,
            evidenceOnlyExternalFacts: d.evidenceOnlyExternalFacts,
            insufficientEvidenceStopsAssertion: d.insufficientEvidenceStopsAssertion,
            contextualFollowupGrounding: d.contextualFollowupGrounding,
            domainSpecificSearchRoutingOnlyOptimizesRetrieval: d.domainSpecificSearchRoutingOnlyOptimizesRetrieval,
            mobileAudioContextPrimedOnUserGesture: d.mobileAudioContextPrimedOnUserGesture,
            proactiveCallGreeting: d.proactiveCallGreeting,
            hiddenModelFailureRetry: d.hiddenModelFailureRetry,
            userFacingMidStreamRetryMessageRemoved: d.userFacingMidStreamRetryMessageRemoved,
          }));
          if (d.voiceRevision !== expected) throw new Error(`expected ${expected}, got ${d.voiceRevision}`);
          if (d.conversationPersistence !== 'call-session-with-trusted-caller-memory') throw new Error('unexpected conversation persistence mode');
          if (d.crossTurnContext !== true) throw new Error('cross-turn context is not enabled');
          if (d.conversationOrchestrator !== 'grounding-by-default-agent-v22') throw new Error('v22 grounding orchestrator is not active');
          if (d.toolCalling !== 'grounding-policy-router-v22') throw new Error('v22 grounding router is not active');
          if (d.groundingPolicy !== 'grounding-by-default-v22') throw new Error('v22 grounding policy is not active');
          if (d.groundingByDefault !== true || d.factualQuestionsSearchByDefault !== true) throw new Error('factual search-by-default is disabled');
          if (d.nonSearchRouteExternalFactAssertionsForbidden !== true) throw new Error('non-search external fact guard is disabled');
          if (d.evidenceOnlyExternalFacts !== true || d.insufficientEvidenceStopsAssertion !== true) throw new Error('evidence-only answer guard is disabled');
          if (d.contextualFollowupGrounding !== true) throw new Error('contextual follow-up grounding is disabled');
          if (d.domainSpecificSearchRoutingOnlyOptimizesRetrieval !== true) throw new Error('domain routing must not own grounding decisions');
          if (d.mobileAudioContextPrimedOnUserGesture !== true) throw new Error('mobile AudioContext priming is disabled');
          if (d.proactiveCallGreeting !== true) throw new Error('proactive call greeting is disabled');
          if (d.hiddenModelFailureRetry !== true || d.userFacingMidStreamRetryMessageRemoved !== true) throw new Error('hidden answer recovery contract failed');
          NODE

      - name: Report external deployment requirement
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Repository Cloudflare credentials are not configured; validation succeeded but deployment must use the authorized production deployment path."
