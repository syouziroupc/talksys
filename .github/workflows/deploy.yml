name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-live-v14.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/worker-v14.js
          node --check src/cloudflare-live-client.js
          node --check src/cloudflare-japanese-stt.js
          node --check src/cloudflare-japanese-tts.js
          node --check src/cloudflare-llm.js
          node --check src/worker.js
          node --check src/web-search.js
          node --check src/search-rerank.js
          node --check src/voice-helpers.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/overlay-preload.cjs
          node --check desktop/overlay.js
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/index.js', 'utf8');
          const match = source.match(/const HTML = `([\s\S]*?)`;\n\nfunction json/);
          if (!match) throw new Error('HTML template not found');
          const browserScript = match[1].match(/<script>([\s\S]*?)<\/script>/);
          if (!browserScript) throw new Error('Browser script not found');
          fs.writeFileSync('/tmp/talksys-browser.js', browserScript[1]);
          NODE
          node --check /tmp/talksys-browser.js

      - name: Run v14.1 architecture and Worker API tests
        run: npm test

      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run

      - name: Install screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: Render Web UI screenshots
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/index.js', 'utf8');
          const match = source.match(/const HTML = `([\s\S]*?)`;\n\nfunction json/);
          if (!match) throw new Error('HTML template not found');
          let html = match[1];
          html = html
            .replace('id="screenPanel" class="screen" hidden', 'id="screenPanel" class="screen"')
            .replace('<video id="screenVideo" autoplay playsinline muted></video>', '<div style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#e4e4e7;color:#52525b;font-size:22px;line-height:1.4">デスクトップ共有プレビュー</div>')
            .replace('画面共有を開始してください。', '共有中。対象を矢印で案内します。');
          fs.writeFileSync('/tmp/talksys.html', html);
          NODE
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,900 --screenshot=web-desktop.png file:///tmp/talksys.html
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=web-mobile.png file:///tmp/talksys.html

      - name: Render Desktop shell screenshots
        run: |
          node <<'NODE'
          const fs = require('fs');
          let html = fs.readFileSync('desktop/index.html', 'utf8');
          html = html.replace(/<script[^>]+><\/script>/g, '');
          fs.writeFileSync('/tmp/talksys-desktop.html', html);
          NODE
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=520,760 --screenshot=desktop-control.png file:///tmp/talksys-desktop.html
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,720 --screenshot=desktop-overlay.png "file://${GITHUB_WORKSPACE}/desktop/overlay.html?debug=1"

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            web-desktop.png
            web-mobile.png
            desktop-control.png
            desktop-overlay.png

      - name: Probe production before deployment
        run: |
          set +e
          body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Production /voice-health is unreachable before deployment."
          else
            BODY="$body" node <<'NODE'
          let data = {};
          try { data = JSON.parse(process.env.BODY || '{}'); } catch {}
          console.log('Current production voiceRevision:', data.voiceRevision || '(missing)');
          NODE
          fi

      - name: Deploy to Cloudflare when repository credentials are configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production revision and deployment readiness
        run: |
          body="$(curl -fsS --max-time 30 "$PRODUCTION_URL/voice-health")" || {
            echo "::error::Production /voice-health is unreachable."
            exit 1
          }
          revision="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
          echo "Production voiceRevision: ${revision:-missing}"
          echo "Expected voiceRevision: $EXPECTED_VOICE_REVISION"
          if [ "$revision" = "$EXPECTED_VOICE_REVISION" ]; then
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Production is stale and deployment is blocked because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured in GitHub Actions secrets."
          else
            echo "::error::Deployment completed or was attempted, but production revision does not match the expected v14.1 revision."
          fi
          exit 1
