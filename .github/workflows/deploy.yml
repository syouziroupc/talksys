name: Validate and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/worker.js
          node --check src/worker-v13.js
          node --check src/gemini-live-v13-client.js
          node --check src/gemini-transcribe-companion.js
          node --check src/realtime-voice-client.js
          node --check src/voice-fallback-client.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/overlay-preload.cjs
          node --check desktop/gemini-live.js
          node --check desktop/overlay.js
          node --check scripts/verify-gemini-live.mjs
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/index.js', 'utf8');
          const match = source.match(/const HTML = `([\s\S]*?)`;\n\nfunction json/);
          if (!match) throw new Error('HTML template not found');
          const browserScript = match[1].match(/<script>([\s\S]*?)<\/script>/);
          if (!browserScript) throw new Error('Browser script not found');
          fs.writeFileSync('/tmp/talksys-browser.js', browserScript[1]);
          NODE
          node --check /tmp/talksys-browser.js
      - name: Verify Gemini Live v13.1 architecture contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const wrangler = fs.readFileSync('wrangler.jsonc','utf8');
          const worker = fs.readFileSync('src/worker-v13.js','utf8');
          const web = fs.readFileSync('src/gemini-live-v13-client.js','utf8');
          const transcribe = fs.readFileSync('src/gemini-transcribe-companion.js','utf8');
          const desktop = fs.readFileSync('desktop/gemini-live.js','utf8');
          const desktopHtml = fs.readFileSync('desktop/index.html','utf8');
          const verifier = fs.readFileSync('scripts/verify-gemini-live.mjs','utf8');
          if (!wrangler.includes('"main": "src/worker-v13.js"')) throw new Error('v13.1 is not the Wrangler entrypoint');
          for (const required of ['gemini-live-v13.1','gemini-3.5-transcribe-live','googleSearch','inputAudioTranscription','outputAudioTranscription','sessionResumption','contextWindowCompression','realtimeInput','audioStreamEnd','thinkingLevel']) {
            if (!(worker + web + transcribe + desktop + verifier).includes(required)) throw new Error('missing Gemini Live contract: ' + required);
          }
          for (const client of [web, desktop]) {
            if (client.includes('SpeechSynthesisUtterance') || client.includes('SpeechRecognition')) throw new Error('Gemini primary path must not use WebSpeech');
            if (client.includes('clientContent:')) throw new Error('ongoing typed chat must use realtimeInput.text');
            for (const required of ["languageCodes: ['ja-JP']", "mode: 'SMART'", 'customVocabulary', 'googleSearch: {}', 'audioStreamEnd: true', "voiceName: 'Kore'"]) {
              if (!client.includes(required)) throw new Error('client contract missing: ' + required);
            }
          }
          for (const required of ["purpose: 'transcription'", 'gemini-3.5-transcribe-live', "languageCodes: ['ja-JP']", "mode: 'SMART'", 'customVocabulary']) {
            if (!transcribe.includes(required)) throw new Error('transcription companion missing: ' + required);
          }
          if (!worker.includes('/gemini-transcribe.js')) throw new Error('transcription companion is not served');
          if (!desktopHtml.includes('<script src="gemini-live.js"></script>')) throw new Error('Desktop is not using Gemini Live');
          if (/renderer\.js|realtime-voice\.js|voice-fallback\.js/.test(desktopHtml)) throw new Error('Desktop still boots legacy voice path');
          for (const required of ['verifySearchAndWaitPhrase','verifyJapaneseTranscriptionWithGeneratedAudio','verifyEightTurnsAndResumption']) {
            if (!verifier.includes(required)) throw new Error('real canary verifier missing: ' + required);
          }
          NODE
      - name: Run Worker API tests
        run: npm test
      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run
      - name: Install screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
      - name: Render Web UI screenshots
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/index.js', 'utf8');
          const match = source.match(/const HTML = `([\s\S]*?)`;\n\nfunction json/);
          if (!match) throw new Error('HTML template not found');
          let html = match[1];
          html = html
            .replace('id="screenPanel" class="screen" hidden', 'id="screenPanel" class="screen"')
            .replace('<video id="screenVideo" autoplay playsinline muted></video>', '<div style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#e4e4e7;color:#52525b;font-size:22px;line-height:1.4">デスクトップ共有プレビュー</div>')
            .replace('<svg id="overlay" class="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>', '<svg class="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="debugArrow" markerWidth="40" markerHeight="40" refX="34" refY="20" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,40 L40,20 z" fill="#ff3b30"/></marker></defs><line x1="720" y1="430" x2="555" y2="535" stroke="#ff3b30" stroke-width="16" stroke-linecap="round" marker-end="url(#debugArrow)"/><circle cx="555" cy="535" r="34" fill="none" stroke="#ff3b30" stroke-width="13"/></svg>')
            .replace('画面共有を開始してください。', '共有中。対象を矢印で案内します。')
            .replace('<div id="targetNote" class="target-note"></div>', '<div class="target-note">→ Google Chrome アイコン（表示例）</div>');
          fs.writeFileSync('/tmp/talksys.html', html);
          NODE
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,900 --screenshot=web-desktop.png file:///tmp/talksys.html
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=web-mobile.png file:///tmp/talksys.html
      - name: Render Desktop Companion screenshots
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('desktop/index.html', 'utf8').replace('<script src="gemini-live.js"></script>', '');
          fs.writeFileSync('/tmp/talksys-desktop.html', html);
          NODE
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=520,760 --screenshot=desktop-control.png file:///tmp/talksys-desktop.html
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,720 --screenshot=desktop-overlay.png "file://${GITHUB_WORKSPACE}/desktop/overlay.html?debug=1"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            web-desktop.png
            web-mobile.png
            desktop-control.png
            desktop-overlay.png
      - name: Deploy directly when repository credentials are configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy