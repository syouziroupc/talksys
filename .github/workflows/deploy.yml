name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: talksys-v34-grok-ja-natural
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Validate v34 production path
        run: |
          node --check src/worker-v34.js
          node --check src/talk-client-v34.js
          node --check src/search-v26.js
          node --check src/grounding-policy-v22.js
          node --test tests/v34-natural-ja.test.mjs
          npm test
          npx wrangler deploy --dry-run

      - name: Deploy through GitHub Actions when Cloudflare credentials exist
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Use connected Cloudflare Git production path when Actions credentials are absent
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare production deployment is handled by the authorized external path."

      - name: Verify production v34 contract after direct deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
          BODY="$body" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (d.voiceRevision !== 'talksys-v34-grok-ja-natural') throw new Error('v34 revision missing');
          if (d.architecture !== 'http-turns-client-vad') throw new Error('v34 architecture missing');
          if (d.conversationModel !== '@cf/zai-org/glm-5.3-flash') throw new Error('GLM mismatch');
          if (d.sttModel !== '@cf/openai/whisper-large-v3-turbo') throw new Error('Whisper mismatch');
          if (d.ttsModel !== 'xai/grok-tts' || d.ttsLanguage !== 'ja') throw new Error('Japanese Grok TTS mismatch');
          if (d.legacyWebSocketVoice !== false || d.durableObjectVoice !== false) throw new Error('legacy voice path still active');
          NODE
