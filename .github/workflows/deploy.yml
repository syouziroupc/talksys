name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v27-grok-conversation-android-realtime
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check src/worker-v27-production.js
          node --check src/worker-v27.js
          node --check src/grok-conversation-v27.js
          node --check src/worker-v26-production.js
          node --check src/worker-v26.js
          node --check src/cloudflare-live-client-v26.js
          node --check src/search-v26.js
          node --check src/glm-conversation-v25.js
          node --check src/bounded-conversation.js
          node --check src/conversation-memory.js
          node --check src/web-search.js
          node --check src/search-fallbacks.js

      - name: Run tests
        run: npm test

      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run

      - name: Probe production before deployment
        run: |
          set +e
          body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};console.log('Current production voiceRevision:',d.voiceRevision||'(missing)')"
          else
            echo "::warning::Production /voice-health is unreachable before deployment."
          fi

      - name: Deploy through GitHub Actions when Cloudflare credentials are configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report external deployment path when Actions credentials are absent
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Repository Cloudflare credentials are absent."
          echo "Production must be deployed through the authorized external production path."
          exit 1

      - name: Verify production v27 contract
        run: |
          expected="$EXPECTED_VOICE_REVISION"
          body=""
          for attempt in $(seq 1 18); do
            set +e
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
              echo "Production voiceRevision: ${current:-missing}"
              if [ "$current" = "$expected" ]; then break; fi
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error::Production did not reach $expected. Deployment is NOT complete."
              exit 1
            fi
            sleep 5
          done

          BODY="$body" EXPECTED="$expected" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          const expected = process.env.EXPECTED;
          console.log(JSON.stringify({
            voiceRevision: d.voiceRevision,
            conversationOrchestrator: d.conversationOrchestrator,
            conversationModel: d.conversationModel,
            conversationModelFallback: d.conversationModelFallback,
            conversationEmergencyFallback: d.conversationEmergencyFallback,
            grokConversationPrimary: d.grokConversationPrimary,
            ttsPrimary: d.ttsPrimary,
            androidAudioWorkletPreferred: d.androidAudioWorkletPreferred,
            androidPcmFrameProbeBeforeCall: d.androidPcmFrameProbeBeforeCall,
          }));
          if (d.voiceRevision !== expected) throw new Error(`expected ${expected}, got ${d.voiceRevision}`);
          if (d.conversationModel !== 'xai/grok-4.20-0309-non-reasoning') throw new Error('Grok is not the primary conversation model');
          if (d.conversationModelFallback !== '@cf/zai-org/glm-5.3-flash') throw new Error('GLM fallback missing');
          if (d.conversationEmergencyFallback !== '@cf/qwen/qwen3.8-27b') throw new Error('Qwen emergency fallback missing');
          if (d.ttsPrimary !== '@cf/myshell-ai/melotts') throw new Error('MeloTTS is not the primary speech synthesizer');
          const required = [
            'grokConversationPrimary','grokNonReasoningRealtime','grokStreaming','inFlightUserContext',
            'directTransitEvidenceFallback','mobileAudioPipelineV26','androidAudioWorkletPreferred',
            'androidScriptProcessorFallback','androidPcmFrameProbeBeforeCall','androidCaptureBackendFailover',
            'androidLifecycleResume','mobileWebSocketHardRecovery','microphoneDiagnostics',
            'contextualSearchSubjectOnlyCarryover'
          ];
          for (const key of required) if (d[key] !== true) throw new Error(`${key} is not true`);
          NODE

      - name: Verify live Android client
        run: |
          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/cloudflare-live.js")"
          grep -F "verifyAndroidCapturePipeline" <<< "$script"
          grep -F "talksys-mic-no-frames" <<< "$script"
          grep -F "resumeMobileRuntime" <<< "$script"
          grep -F "socket?.close()" <<< "$script"
          grep -F "callStartPending" <<< "$script"
          grep -F "talksys-barge-in" <<< "$script"

      - name: Verify contextual search regressions
        run: |
          transit="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v27-transit-followup")"
          BODY="$transit" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error(`transit follow-up failed: ${d.directTransitError || 'no evidence'}`);
          const q = String(d.resolvedQuestion || '');
          if (!/鷺沼/.test(q) || !/相模大野/.test(q) || !/どうですか/.test(q)) throw new Error(`in-flight context lost: ${q}`);
          if (!(d.sources || []).some(s => /鷺沼/.test(JSON.stringify(s)) && /相模大野/.test(JSON.stringify(s)))) throw new Error('route evidence lacks endpoints');
          NODE

          shopping="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v27-context")"
          BODY="$shopping" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error('shopping context smoke failed');
          const q = String(d.resolvedQuestion || '');
          if (!/パソコン/.test(q) || !/中古/.test(q) || !/横浜/.test(q) || /YouTube|ネットサーフィン/i.test(q)) throw new Error(`bad shopping context: ${q}`);
          NODE
