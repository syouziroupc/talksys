name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-tools-v20.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/worker-v14.js
          node --check src/worker-v19.js
          node --check src/worker-v20.js
          node --check src/search-tool-v20.js
          node --check src/cloudflare-live-client.js
          node --check src/cloudflare-japanese-stt.js
          node --check src/cloudflare-japanese-tts.js
          node --check src/cloudflare-llm.js
          node --check src/bounded-conversation.js
          node --check src/conversation-memory.js
          node --check src/search-answer-v18.js
          node --check src/web-search.js
          node --check src/search-rerank.js
          node --check src/search-orchestrator.js
          node --check src/search-fallbacks.js
          node --check src/streaming-workers-ai.js
          node --check src/voice-helpers.js
          node --check desktop/main.cjs

      - name: Run tests
        run: npm test

      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run

      - name: Install screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: Render phone consultation UI screenshots
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/index.js', 'utf8');
          const match = source.match(/const HTML = `([\s\S]*?)`;\n\nfunction json/);
          if (!match) throw new Error('HTML template not found');
          fs.writeFileSync('/tmp/talksys.html', match[1]);
          NODE
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,900 --screenshot=web-desktop.png file:///tmp/talksys.html
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=web-mobile.png file:///tmp/talksys.html

      - uses: actions/upload-artifact@v7
        with:
          name: phone-ui-screenshots
          path: |
            web-desktop.png
            web-mobile.png

      - name: Probe production before deployment
        run: |
          set +e
          body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Production /voice-health is unreachable before deployment."
          else
            BODY="$body" node <<'NODE'
          let data = {};
          try { data = JSON.parse(process.env.BODY || '{}'); } catch {}
          console.log('Current production voiceRevision:', data.voiceRevision || '(missing)');
          NODE
          fi

      - name: Deploy to Cloudflare when repository credentials are configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production v20 voice-agent contract when deployment credentials are configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          body="$(curl -fsS --max-time 30 "$PRODUCTION_URL/voice-health")" || {
            echo "::error::Production /voice-health is unreachable."
            exit 1
          }
          BODY="$body" EXPECTED="$EXPECTED_VOICE_REVISION" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          const expected = process.env.EXPECTED;
          console.log(JSON.stringify({
            voiceRevision: d.voiceRevision,
            conversationPersistence: d.conversationPersistence,
            sessionMemoryLifecycle: d.sessionMemoryLifecycle,
            sessionMemoryTimeBasedExpiry: d.sessionMemoryTimeBasedExpiry,
            crossTurnContext: d.crossTurnContext,
            crossSessionContext: d.crossSessionContext,
            trustedCallerIdentityRequired: d.trustedCallerIdentityRequired,
            voiceBuiltinHistoryDisabled: d.voiceBuiltinHistoryDisabled,
            conversationContextMaxMessages: d.conversationContextMaxMessages,
            callerContextMaxMessages: d.callerContextMaxMessages,
            speechClarityProcessing: d.speechClarityProcessing,
            conversationOrchestrator: d.conversationOrchestrator,
            primaryConversationModel: d.primaryConversationModel,
            toolCalling: d.toolCalling,
            webSearchTool: d.webSearchTool,
            webSearchToolRole: d.webSearchToolRole,
            modelDecidesToolUse: d.modelDecidesToolUse,
            mandatoryFreshSearchGuard: d.mandatoryFreshSearchGuard,
            searchPlannerBeforeRetrieval: d.searchPlannerBeforeRetrieval,
            searchAnswerCascade: d.searchAnswerCascade,
            searchAuditModelCascade: d.searchAuditModelCascade,
            fixedSearchWaitSpeech: d.fixedSearchWaitSpeech,
            searchWaitPhrase: d.searchWaitPhrase,
          }));
          if (d.voiceRevision !== expected) throw new Error(`expected ${expected}, got ${d.voiceRevision}`);
          if (d.conversationPersistence !== 'call-session-with-trusted-caller-memory') throw new Error('unexpected conversation persistence mode');
          if (d.sessionMemoryLifecycle !== 'start_call-to-end_call') throw new Error('unexpected session lifecycle');
          if (d.sessionMemoryTimeBasedExpiry !== false) throw new Error('time-based session expiry must be disabled');
          if (d.crossTurnContext !== true) throw new Error('cross-turn context is not enabled');
          if (d.crossSessionContext !== 'trusted-caller-only') throw new Error('cross-session context must require a trusted caller');
          if (d.trustedCallerIdentityRequired !== true) throw new Error('trusted caller identity is not required');
          if (d.voiceBuiltinHistoryDisabled !== true) throw new Error('shared voice history must be disabled');
          if (d.conversationContextMaxMessages !== 28) throw new Error('unexpected session context window');
          if (d.callerContextMaxMessages !== 20) throw new Error('unexpected caller context window');
          if (d.speechClarityProcessing !== true) throw new Error('speech clarity processing is not enabled');
          if (d.conversationOrchestrator !== 'single-agent-v20') throw new Error('v20 single-agent orchestrator is not active');
          if (d.toolCalling !== 'cloudflare-embedded-function-calling') throw new Error('embedded function calling is not active');
          if (d.webSearchToolRole !== 'evidence-only') throw new Error('web search tool must return evidence only');
          if (d.modelDecidesToolUse !== true) throw new Error('conversation model must decide ordinary tool use');
          if (d.mandatoryFreshSearchGuard !== true) throw new Error('fresh-fact search guard is disabled');
          if (d.searchPlannerBeforeRetrieval !== false) throw new Error('legacy search planner must not own v20 retrieval');
          if (d.searchAnswerCascade !== false || d.searchAuditModelCascade !== false) throw new Error('legacy search answer cascades must be disabled');
          if (d.fixedSearchWaitSpeech !== true || d.searchWaitPhrase !== '少し調べますね。') throw new Error('search wait speech contract failed');
          NODE

      - name: Report external deployment requirement
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Repository Cloudflare credentials are not configured; validation succeeded but deployment must use the authorized production deployment path."
