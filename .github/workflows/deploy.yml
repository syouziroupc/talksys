name: Deploy TalkSys production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy/production-trigger.txt'

permissions:
  contents: read
  checks: read

concurrency:
  group: talksys-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require main branch and successful Validate TalkSys check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deploy is restricted to refs/heads/main; got $GITHUB_REF"
            exit 1
          fi

          for attempt in $(seq 1 60); do
            checks="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"

            status="$(CHECKS_JSON="$checks" EXPECTED_SHA="$GITHUB_SHA" node <<'NODE'
          const data = JSON.parse(process.env.CHECKS_JSON || '{}');
          const sha = process.env.EXPECTED_SHA || '';
          const matches = (data.check_runs || []).filter((run) => run?.name === 'validate' && run?.head_sha === sha);
          if (matches.some((run) => run?.status === 'completed' && run?.conclusion === 'success')) {
            process.stdout.write('success');
          } else if (matches.some((run) => run?.status === 'completed' && run?.conclusion && run.conclusion !== 'success')) {
            process.stdout.write('failed');
          } else {
            process.stdout.write('pending');
          }
          NODE
            )"

            if [[ "$status" == "success" ]]; then
              echo "Validated exact production revision $GITHUB_SHA"
              break
            fi
            if [[ "$status" == "failed" ]]; then
              echo "Validate TalkSys failed for exact revision $GITHUB_SHA"
              exit 1
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "Timed out waiting for successful Validate TalkSys check for $GITHUB_SHA"
              exit 1
            fi
            sleep 5
          done

      - name: Verify required Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Validate exact revision again before deploy
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:check
          npm run architecture:graph
          find src archive -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run

      - name: Deploy exact validated revision
        shell: bash
        run: npx wrangler deploy

      - name: Verify current v45 production contract
        shell: bash
        run: |
          set -euo pipefail
          expected_revision="$(node -e "const fs=require('fs');const s=fs.readFileSync('src/worker-v44.js','utf8');const m=s.match(/const REVISION = '([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          expected_voice="$(node --input-type=module -e "import {CLIENT_REVISION} from './src/talk-client-v45.js';process.stdout.write(CLIENT_REVISION)")"
          expected_ui="$(node --input-type=module -e "import {UI_REVISION} from './src/ui-v45.js';process.stdout.write(UI_REVISION)")"
          expected_stt="$(node --input-type=module -e "import {STT_REVISION} from './src/stt-v45.js';process.stdout.write(STT_REVISION)")"

          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            ok="$(BODY="$body" EXPECTED_REVISION="$expected_revision" EXPECTED_VOICE="$expected_voice" EXPECTED_UI="$expected_ui" EXPECTED_STT="$expected_stt" node - <<'NODE'
          let d={};
          try { d=JSON.parse(process.env.BODY||'{}'); } catch {}
          const ok = d.ok===true
            && d.revision===process.env.EXPECTED_REVISION
            && d.voiceRevision===process.env.EXPECTED_VOICE
            && d.uiRevision===process.env.EXPECTED_UI
            && d.sttRevision===process.env.EXPECTED_STT
            && d.voiceArchitecture==='http-turns-client-vad-v45'
            && d.adaptiveNoiseVad===true
            && d.ambientCalibration===true
            && d.legacyWebSocketVoice===false
            && d.durableObjectVoice===false
            && d.legacyAgentRoute===false
            && d.unifiedTurnRouter===true
            && d.legacyV43TurnDelegation===false
            && d.apiFirst===true
            && d.apiParallel===true
            && d.groundedEvidenceFallback===true
            && d.externalFailureUsesCasualModel===false
            && d.modelTimeoutMs===12000
            && d.searchDirectorModel==='@cf/qwen/qwen3-30b-a3b-fp8'
            && d.searchDefault==='intent-routed-v45';
          process.stdout.write(String(Boolean(ok)));
          NODE
            )"
            [[ "$ok" == "true" ]] && break
            [[ "$attempt" -eq 20 ]] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"

      - name: Verify live v45 UI and microphone client
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl -fsS --max-time 20 "$PRODUCTION_URL/")"
          grep -F 'talksys-v45-ui-restored-20260911' <<< "$page"
          grep -F '/talk-v45.js' <<< "$page"
          grep -F '非常用の文字入力' <<< "$page"

          client="$(curl -fsS --max-time 20 "$PRODUCTION_URL/talk-v45.js")"
          grep -F 'talksys-v45-http-adaptive-vad' <<< "$client"
          grep -F 'getUserMedia' <<< "$client"
          grep -F '/api/transcribe' <<< "$client"
          grep -F '/api/turn' <<< "$client"
          grep -F 'noiseBoost' <<< "$client"
          grep -F 'calibrationUntil' <<< "$client"
          if grep -E 'new[[:space:]]+WebSocket|/agents/' <<< "$client"; then
            echo 'legacy websocket/agent voice path returned'
            exit 1
          fi

      - name: Production answer smoke
        shell: bash
        run: |
          set -euo pipefail
          payload='{"text":"12345÷15","history":[]}'
          out="$(curl -fsS --max-time 20 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/turn")"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.route!=='deterministic-v45'||d.search!==false||!String(d.answer||'').includes('823'))throw new Error(process.env.OUT);"

          payload='{"text":"別府市の今日の天気は？","history":[]}'
          out="$(curl -fsS --max-time 75 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/turn")"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');const tools=(d.apiSources||[]).map(x=>x.tool);if(!d.ok||d.route!=='api-first-v45'||!tools.includes('jma_weather'))throw new Error(process.env.OUT);"

          payload='{"text":"どれがいい？","history":[{"role":"user","content":"大学のレポート用に中古ノートPCを探してる。予算は3万円。"},{"role":"assistant","content":"Officeとブラウザ中心ですね。"}]}'
          out="$(curl -fsS --max-time 45 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/turn")"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');const a=String(d.answer||'');if(!d.ok||a.length<8||/何について|もう少し詳しく|詳しく教えて/.test(a))throw new Error(process.env.OUT);"
