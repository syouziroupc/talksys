name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_REVISION: talksys-v44-default-exhaustive-search
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Validate current production path
        run: |
          node --check src/search-probes-v44.js
          node --check src/search-v44.js
          node --check src/worker-v44.js
          node --test tests/v44-deep-search-default.test.mjs
          npm test
          npx wrangler deploy --dry-run

      - name: Detect Cloudflare deployment credentials
        id: cf_auth
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment credentials are missing. Wrangler production deployment cannot run from this workflow. Production will still be probed for any external promotion."
          fi

      - name: Deploy v44 through Wrangler
        if: ${{ steps.cf_auth.outputs.available == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify v44 production contract
        shell: bash
        run: |
          if [ "${{ steps.cf_auth.outputs.available }}" = "true" ]; then
            attempts=20
          else
            attempts=5
          fi
          body=""
          current=""
          for attempt in $(seq 1 "$attempts"); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||d.revision||''))")"
            [ "$current" = "$EXPECTED_REVISION" ] && break
            [ "$attempt" -eq "$attempts" ] && {
              echo "$body"
              echo "::error::Expected $EXPECTED_REVISION but production returned ${current:-no revision}."
              if [ "${{ steps.cf_auth.outputs.available }}" != "true" ]; then
                echo "::error::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable Wrangler production deployment."
              fi
              exit 1
            }
            sleep 3
          done
          BODY="$body" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (d.voiceRevision !== 'talksys-v44-default-exhaustive-search') throw new Error('v44 revision missing');
          if (d.webSearch !== true) throw new Error('web search disabled');
          if (d.searchDefault !== 'all-substantive-turns') throw new Error('default exhaustive search missing');
          if (d.searchMaxQueries !== 14 || d.searchMaxRecoveryQueries !== 5 || d.searchMaxTotalQueries !== 19) throw new Error('v44 query budget mismatch');
          if (d.searchMaxRounds !== 3 || d.searchSourceLimit !== 18) throw new Error('v44 depth limits mismatch');
          if (d.searchPageEnrichment !== true || d.searchCoverageAudit !== true || d.searchIndependentSources !== true) throw new Error('v44 quality controls missing');
          if (d.searchEngineRotation !== true || d.searchEngineRetry !== true || d.searchMaxEngineRetries !== 5) throw new Error('v44 resilient engine retry missing');
          if (d.searchHostDiversity !== true || d.searchMaxPerHost !== 2) throw new Error('v44 host diversity missing');
          if (d.searchProbeConcurrency !== 4) throw new Error('v44 probe concurrency mismatch');
          if (d.searchSubrequestBudgetAware !== true || d.searchExternalSubrequestWorstTarget >= 50) throw new Error('v44 subrequest headroom missing');
          if (d.specializedSearchRoutesPreserved !== true) throw new Error('specialized search routes not preserved');
          NODE

      - name: Verify default deep-search planning
        run: |
          payload='{"text":"Cloudflare Workersとは何？","history":[]}'
          out="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/plan")"
          echo "$out"
          OUT="$out" node <<'NODE'
          const d = JSON.parse(process.env.OUT || '{}');
          if (!d.ok || d.search !== true) throw new Error('substantive turn was not routed to search');
          if (d.planner !== 'deep-search-v44') throw new Error(`unexpected planner: ${d.planner}`);
          if (d.searchMode !== 'exhaustive-default') throw new Error('exhaustive search mode missing');
          NODE

      - name: Verify resilient deep-search turn
        run: |
          payload='{"text":"Cloudflare Workersの外部サブリクエスト制限を現在の情報で短く教えて","history":[],"searchPlan":{"planner":"deep-search-v44"}}'
          out="$(curl -fsS --max-time 45 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/turn")"
          OUT="$out" node <<'NODE'
          const d = JSON.parse(process.env.OUT || '{}');
          if (!d.ok || d.route !== 'deep-search-v44') throw new Error(`deep-search turn failed: ${d.route || d.error || 'unknown'}`);
          if (!Array.isArray(d.sources) || d.sources.length < 1) throw new Error('deep-search returned no sources');
          if (!d.searchDiagnostics || !Number.isFinite(d.searchDiagnostics.hostCount)) throw new Error('search diagnostics missing');
          if (d.searchDiagnostics.externalSubrequestWorstTarget >= 50) throw new Error('search request budget too high');
          console.log(JSON.stringify({route:d.route, sourceCount:d.sources.length, diagnostics:d.searchDiagnostics, timings:d.timings}));
          NODE

      - name: Verify specialized weather route remains available
        run: |
          payload='{"text":"明日の別府市の天気は？","history":[]}'
          out="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/plan")"
          echo "$out"
          OUT="$out" node <<'NODE'
          const d = JSON.parse(process.env.OUT || '{}');
          if (!d.ok || d.search !== true) throw new Error('weather route did not search');
          if (!String(d.planner || '').includes('weather')) throw new Error(`weather specialized planner lost: ${d.planner}`);
          NODE
