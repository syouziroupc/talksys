name: Validate search grounding branch

on:
  push:
    branches: [fix/search-grounding-v16]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/worker.js
          node --check src/web-search.js
          node --check src/search-rerank.js
          node --check src/streaming-workers-ai.js
          node --check tests/web-search.test.mjs
          node --check tests/search-rerank.test.mjs
          node --check tests/streaming-workers-ai.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run
