name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v23-mobile-search-pc-quality
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check src/worker-v23-production.js
          node --check src/worker-v23.js
          node --check src/search-v23.js
          node --check src/cloudflare-live-client-v23.js
          node --check src/cloudflare-live-client-v23-final.js
          node --check src/search-trace-client-v23.js
          node --check src/worker-v22.js
          node --check src/search-v22.js
          node --check src/grounding-policy-v22.js
          node --check src/bounded-conversation.js
          node --check src/conversation-memory.js
          node --check src/web-search.js
          node --check src/search-fallbacks.js

      - name: Run tests
        run: npm test

      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run

      - name: Probe production before deployment
        run: |
          set +e
          body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};console.log('Current production voiceRevision:',d.voiceRevision||'(missing)')"
          else
            echo "::warning::Production /voice-health is unreachable before deployment."
          fi

      - name: Deploy through GitHub Actions when Cloudflare credentials are configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report external deployment path when Actions credentials are absent
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Repository Cloudflare credentials are absent."
          echo "Production must be deployed through the authorized external production path."
          echo "This job will fail unless production actually reaches v23."

      - name: Verify production v23 contract
        run: |
          expected="$EXPECTED_VOICE_REVISION"
          body=""
          for attempt in $(seq 1 18); do
            set +e
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
              echo "Production voiceRevision: ${current:-missing}"
              if [ "$current" = "$expected" ]; then break; fi
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error::Production did not reach $expected. Deployment is NOT complete."
              exit 1
            fi
            sleep 10
          done

          BODY="$body" EXPECTED="$expected" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          const expected = process.env.EXPECTED;
          console.log(JSON.stringify({
            voiceRevision: d.voiceRevision,
            conversationOrchestrator: d.conversationOrchestrator,
            webSearchTool: d.webSearchTool,
            groundingByDefault: d.groundingByDefault,
            parallelIntentSearch: d.parallelIntentSearch,
            audibleSearchWaitSpeech: d.audibleSearchWaitSpeech,
            pcExpertAnswerMode: d.pcExpertAnswerMode,
            groundedContinuationRetry: d.groundedContinuationRetry,
            microphoneConstraintFallback: d.microphoneConstraintFallback,
            microphoneFrameWatchdog: d.microphoneFrameWatchdog,
            microphoneAutoRecovery: d.microphoneAutoRecovery,
            workletToScriptProcessorAutoFallback: d.workletToScriptProcessorAutoFallback,
            duplicateSearchTraceFixed: d.duplicateSearchTraceFixed,
            duplicateBrowserTtsGuard: d.duplicateBrowserTtsGuard,
            serverTtsOwnershipGuard: d.serverTtsOwnershipGuard,
            mobileAudioContextPrimedOnUserGesture: d.mobileAudioContextPrimedOnUserGesture,
            hiddenModelFailureRetry: d.hiddenModelFailureRetry,
            userFacingMidStreamRetryMessageRemoved: d.userFacingMidStreamRetryMessageRemoved,
          }));
          if (d.voiceRevision !== expected) throw new Error(`expected ${expected}, got ${d.voiceRevision}`);
          if (d.conversationOrchestrator !== 'grounded-conversation-agent-v23') throw new Error('v23 orchestrator is not active');
          if (d.groundingByDefault !== true) throw new Error('grounding-by-default is disabled');
          if (d.parallelIntentSearch !== true || d.audibleSearchWaitSpeech !== true) throw new Error('v23 search contract failed');
          if (d.pcExpertAnswerMode !== true || d.pcExpertGroundedDetail !== true) throw new Error('PC expert mode is disabled');
          if (d.groundedContinuationRetry !== true) throw new Error('grounded continuation retry is disabled');
          if (d.microphoneConstraintFallback !== true || d.microphoneFrameWatchdog !== true || d.microphoneAutoRecovery !== true) throw new Error('mobile microphone recovery contract failed');
          if (d.workletToScriptProcessorAutoFallback !== true) throw new Error('capture processor fallback is disabled');
          if (d.duplicateSearchTraceFixed !== true || d.duplicateBrowserTtsGuard !== true || d.serverTtsOwnershipGuard !== true) throw new Error('duplicate output guards failed');
          if (d.mobileAudioContextPrimedOnUserGesture !== true) throw new Error('mobile AudioContext priming is disabled');
          if (d.hiddenModelFailureRetry !== true || d.userFacingMidStreamRetryMessageRemoved !== true) throw new Error('answer recovery contract failed');
          NODE
