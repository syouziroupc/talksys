name: Validate, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_REVISION: talksys-v44-default-exhaustive-search
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Validate current production path
        run: |
          node --check src/search-v44.js
          node --check src/worker-v44.js
          node --test tests/v44-deep-search-default.test.mjs
          npm test
          npx wrangler deploy --dry-run

      - name: Deploy through GitHub Actions when Cloudflare credentials exist
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Use authorized external production path when Actions credentials are absent
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare production deployment is handled by the authorized external path."

      - name: Verify v44 production contract
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||d.revision||''))")"
            [ "$current" = "$EXPECTED_REVISION" ] && break
            [ "$attempt" -eq 20 ] && { echo "$body"; exit 1; }
            sleep 3
          done
          BODY="$body" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (d.voiceRevision !== 'talksys-v44-default-exhaustive-search') throw new Error('v44 revision missing');
          if (d.webSearch !== true) throw new Error('web search disabled');
          if (d.searchDefault !== 'all-substantive-turns') throw new Error('default exhaustive search missing');
          if (d.searchMaxQueries !== 14 || d.searchMaxRounds !== 3 || d.searchSourceLimit !== 18) throw new Error('v44 deep-search limits mismatch');
          if (d.searchPageEnrichment !== true || d.searchCoverageAudit !== true || d.searchIndependentSources !== true) throw new Error('v44 deep-search quality controls missing');
          if (d.specializedSearchRoutesPreserved !== true) throw new Error('specialized search routes not preserved');
          NODE

      - name: Verify default deep-search planning
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          payload='{"text":"Cloudflare Workersとは何？","history":[]}'
          out="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/plan")"
          echo "$out"
          OUT="$out" node <<'NODE'
          const d = JSON.parse(process.env.OUT || '{}');
          if (!d.ok || d.search !== true) throw new Error('substantive turn was not routed to search');
          if (d.planner !== 'deep-search-v44') throw new Error(`unexpected planner: ${d.planner}`);
          if (d.searchMode !== 'exhaustive-default') throw new Error('exhaustive search mode missing');
          NODE

      - name: Verify specialized weather route remains available
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          payload='{"text":"明日の別府市の天気は？","history":[]}'
          out="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/plan")"
          echo "$out"
          OUT="$out" node <<'NODE'
          const d = JSON.parse(process.env.OUT || '{}');
          if (!d.ok || d.search !== true) throw new Error('weather route did not search');
          if (!String(d.planner || '').includes('weather')) throw new Error(`weather specialized planner lost: ${d.planner}`);
          NODE
