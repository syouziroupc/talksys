name: TalkSys v37 STT fix deploy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v37-stt-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Require Cloudflare production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate mobile STT fix
        run: |
          node --check src/worker-v37.js
          node --test tests/v37-grounded-continuity.test.mjs
          npm test
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy TalkSys to Cloudflare production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify live v37 STT guard
        shell: bash
        run: |
          node <<'NODE'
          const url='https://talksys.syouziroupc.workers.dev/voice-health';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let i=0;i<24;i++){
            try{
              const r=await fetch(url,{headers:{'cache-control':'no-cache'}});
              last=await r.text();
              if(r.ok){
                const j=JSON.parse(last);
                const ok=j.voiceRevision==='talksys-v37-grounded-continuity'
                  && j.sttModel==='@cf/openai/whisper-large-v3-turbo'
                  && j.sttPrompt===false
                  && j.sttHallucinationGuard===true
                  && j.sttSignalGate===true;
                if(ok){ console.log(JSON.stringify(j,null,2)); process.exit(0); }
              }
            }catch(e){ last=String(e); }
            await sleep(5000);
          }
          console.error('Live contract did not converge:',last);
          process.exit(1);
          NODE
