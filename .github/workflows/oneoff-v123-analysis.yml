name: One-off v123 phone stability analysis

on:
  push:
    branches: [repair/phone-stability-v123]
    paths:
      - '.github/workflows/oneoff-v123-analysis.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Capture baseline and current phone/search diffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v123
          baseline=ba1c7a15220d53555c4b1a405194c3fefc831f9c
          git diff --no-ext-diff --unified=8 "$baseline"..HEAD -- \
            src/integrated-entry.js src/stt-v45.js src/telephony/index.js src/telephony/phone-tts.js wrangler.jsonc \
            > /tmp/v123/baseline-current.diff
          git show "$baseline":src/integrated-entry.js > /tmp/v123/baseline-integrated-entry.js
          cp src/integrated-entry.js /tmp/v123/current-integrated-entry.js
          git show "$baseline":src/stt-v45.js > /tmp/v123/baseline-stt-v45.js
          cp src/stt-v45.js /tmp/v123/current-stt-v45.js
          git show "$baseline":src/telephony/index.js > /tmp/v123/baseline-telephony-index.js
          cp src/telephony/index.js /tmp/v123/current-telephony-index.js
          git show "$baseline":src/telephony/phone-tts.js > /tmp/v123/baseline-phone-tts.js
          cp src/telephony/phone-tts.js /tmp/v123/current-phone-tts.js
          git show "$baseline":wrangler.jsonc > /tmp/v123/baseline-wrangler.jsonc
          cp wrangler.jsonc /tmp/v123/current-wrangler.jsonc
          {
            echo '=== grounding / fail closed / JMA ==='
            grep -nE 'grounding|fail.?closed|structured-jma|JMA|jma|推測では答え|根拠を十分|searchRetried|searchRetry' src/integrated-entry.js || true
            echo '=== STT / VAD / gain ==='
            grep -nE 'VAD|vad|noise|rms|gain|PHONE_STT|initial_prompt|pre.?roll|speech' src/stt-v45.js src/telephony/index.js wrangler.jsonc || true
            echo '=== TTS voice / delivery ==='
            grep -nE 'TTS_VOICE|TTS_DELIVERY|OUTPUT_GAIN|PHONE_TTS_DEFAULT_VOICE|phoneTtsDelivery|higher-pitch|loud' src/telephony/phone-tts.js wrangler.jsonc || true
          } > /tmp/v123/markers.txt
      - uses: actions/upload-artifact@v6
        with:
          name: v123-phone-stability-analysis
          path: /tmp/v123
          retention-days: 2
