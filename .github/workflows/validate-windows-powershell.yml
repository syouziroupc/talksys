name: Validate Windows PowerShell launchers

on:
  push:
    branches:
      - main
    paths:
      - discord-voice-smoke/start.ps1
      - discord-voice-smoke/start-utf8.ps1
      - discord-voice-smoke/update-and-start.ps1
      - discord-voice-smoke/update-and-start-utf8.ps1
      - .github/workflows/validate-windows-powershell.yml
  pull_request:
    paths:
      - discord-voice-smoke/start.ps1
      - discord-voice-smoke/start-utf8.ps1
      - discord-voice-smoke/update-and-start.ps1
      - discord-voice-smoke/update-and-start-utf8.ps1
      - .github/workflows/validate-windows-powershell.yml
  workflow_dispatch:

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compatibility bootstraps and BOM runtime copies
        shell: powershell
        run: |
          $pairs = @(
            @{ Bootstrap = 'discord-voice-smoke/start.ps1'; Implementation = 'discord-voice-smoke/start-utf8.ps1'; Runtime = 'discord-voice-smoke/.ci-start-runtime.ps1' },
            @{ Bootstrap = 'discord-voice-smoke/update-and-start.ps1'; Implementation = 'discord-voice-smoke/update-and-start-utf8.ps1'; Runtime = 'discord-voice-smoke/.ci-update-runtime.ps1' }
          )

          foreach ($pair in $pairs) {
            $bootstrapBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $pair.Bootstrap))
            if (($bootstrapBytes | Where-Object { $_ -gt 0x7F }).Count -gt 0) {
              throw "$($pair.Bootstrap) must remain ASCII-only for Windows PowerShell 5.1"
            }

            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $pair.Bootstrap), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$($pair.Bootstrap) failed Windows PowerShell parsing"
            }

            $utf8NoBom = New-Object System.Text.UTF8Encoding -ArgumentList $false
            $utf8Bom = New-Object System.Text.UTF8Encoding -ArgumentList $true
            $source = [System.IO.File]::ReadAllText((Resolve-Path $pair.Implementation), $utf8NoBom)
            [System.IO.File]::WriteAllText($pair.Runtime, $source, $utf8Bom)
            try {
              $runtimeBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $pair.Runtime))
              if ($runtimeBytes.Length -lt 3 -or $runtimeBytes[0] -ne 0xEF -or $runtimeBytes[1] -ne 0xBB -or $runtimeBytes[2] -ne 0xBF) {
                throw "$($pair.Runtime) did not receive a UTF-8 BOM"
              }
              $runtimeTokens = $null
              $runtimeErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $pair.Runtime), [ref]$runtimeTokens, [ref]$runtimeErrors)
              if ($runtimeErrors.Count -gt 0) {
                $runtimeErrors | ForEach-Object { Write-Error $_.Message }
                throw "$($pair.Implementation) failed after BOM compatibility conversion"
              }
            } finally {
              Remove-Item -LiteralPath $pair.Runtime -Force -ErrorAction SilentlyContinue
            }
          }
