name: One-off hard minimal vs low
on:
  push:
    branches: [qa/expanded-ai-quality-prompt-audit-v1]
    paths:
      - 'scripts/experimental-hard-minimal-vs-low.mjs'
      - '.github/workflows/oneoff-hard-minimal-vs-low.yml'
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AUDIT_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate experiment
        run: |
          node --check scripts/experimental-hard-minimal-vs-low.mjs
          test -n "${GEMINI_API_KEY:-}"
      - name: Run experiment
        run: node scripts/experimental-hard-minimal-vs-low.mjs
      - name: Publish summary
        run: cat artifacts/hard-minimal-vs-low/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hard-minimal-vs-low-report
          path: artifacts/hard-minimal-vs-low/
          retention-days: 30