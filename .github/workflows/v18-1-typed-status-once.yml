name: Apply v18.1 typed status polish once

on:
  push:
    branches: [fix/v18-typed-speech-connectivity-search-progress]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v18-typed-speech-connectivity-search-progress
          fetch-depth: 0
      - name: Keep typed-only status silent-aware
        run: |
          python -c "from pathlib import Path; p=Path('src/cloudflare-live-client.js'); s=p.read_text(); old=\"else if (serverStatus === 'speaking') setStatus('AIが話しています。途中でそのまま割り込めます。');\"; new=\"else if (serverStatus === 'speaking') setStatus(desiredCall ? 'AIが話しています。途中でそのまま割り込めます。' : '文字で回答しています…');\"; assert old in s; p.write_text(s.replace(old,new,1))"
          git rm .github/workflows/v18-1-typed-status-once.yml
          git config user.name talksys-ci
          git config user.email talksys-ci@users.noreply.github.com
          git add src/cloudflare-live-client.js
          git commit -m "v18.1: keep typed-only response status silent-aware"
          git push origin HEAD:fix/v18-typed-speech-connectivity-search-progress
