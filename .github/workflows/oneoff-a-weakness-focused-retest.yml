name: One-off A weakness focused retest

on:
  push:
    branches:
      - qa/a-weakness-focused-retest
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate
        run: |
          set -euo pipefail
          node --check scripts/experimental-a-weakness-focused-retest.mjs
          test -n "${GEMINI_API_KEY:-}"
      - name: Run focused retest
        run: node scripts/experimental-a-weakness-focused-retest.mjs
      - name: Summary
        run: |
          if [[ -f artifacts/a-weakness-focused-retest/report.md ]]; then cat artifacts/a-weakness-focused-retest/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: a-weakness-focused-retest-report
          path: artifacts/a-weakness-focused-retest/
          retention-days: 30
