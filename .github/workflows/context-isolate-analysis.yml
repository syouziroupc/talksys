name: Context isolate analysis
on:
  push:
    branches:
      - analysis/context-repro-20261002
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - name: Compare immediate context and resolved question
        run: |
          node <<'NODE'
          const base='https://talksys.syouziroupc.workers.dev';
          const pc='パソコンが壊れて買い替えたい。予算は3万円ぐらい。ネットで中古パソコンを買いたい。';
          const a='予算3万円なら、中古パソコン専門店で保証付きのものを選ぶと安心です。';
          async function run(label,payload){
            const r=await fetch(base+'/api/turn',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId:'ctx-'+label+'-'+Date.now(),utteranceId:label,channel:'discord',previousInteractionId:'',...payload})});
            const j=await r.json();
            console.log('CTX_RESULT '+JSON.stringify({label,answer:j.answer||'',queries:j.queries||[],search:Boolean(j.search),route:j.route||''}));
          }
          await run('last-pair',{text:'おすすめのお店を教えてください。',history:[{role:'user',content:pc},{role:'assistant',content:a}]});
          await run('resolved',{text:pc+' おすすめのお店を教えてください。',history:[]});
          NODE
