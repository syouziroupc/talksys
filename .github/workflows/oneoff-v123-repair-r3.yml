name: One-off v123 phone stability repair r3

on:
  push:
    branches: [repair/phone-stability-v123]
    paths:
      - '.github/workflows/oneoff-v123-repair-r3.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Apply guarded v123 repair and permanent regression contracts
        run: |
          python scripts/fix-v123-patcher-r2.py
          python scripts/apply-v123-stability-repair.py
          python scripts/finalize-v123-r3.py
      - name: Syntax and focused stability checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/integrated-entry.js
          node --check src/stt-v45.js
          node --check src/telephony/index.js
          node --check src/telephony/phone-tts.js
          node --test \
            tests/phone-stability-baseline-v123.test.mjs \
            tests/gemini-generic-verification-v57.test.mjs \
            tests/gemini-personalization-v55.test.mjs \
            tests/phone-grounding-profile-v121.test.mjs \
            tests/phone-quality-personalization-v120.test.mjs \
            tests/phone-conversation-baseline-lock-v118.test.mjs \
            tests/phone-second-turn-ack-zip-v119.test.mjs \
            tests/phone-fast-reaction-v2.test.mjs \
            tests/voice-cancel-noise-v58.test.mjs \
            tests/voice-latency-invariants.test.mjs
      - name: Architecture and reuse gates
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:check
          npm run architecture:graph
          npm run reuse:check
      - name: Full active regression
        shell: bash
        run: |
          set +e
          npm test > full-active.log 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo '=== exact failing TAP contexts ==='
            grep -n -B 20 -A 35 '^not ok ' full-active.log || true
          fi
          echo '=== summary ==='
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo) ' full-active.log | tail -n 8 || true
          exit "$status"
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - name: Clean one-off helpers and verify production scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/oneoff-v123-analysis.yml \
            .github/workflows/oneoff-v123-repair.yml \
            .github/workflows/oneoff-v123-repair-r2.yml \
            .github/workflows/oneoff-v123-repair-r3.yml \
            scripts/apply-v123-stability-repair.py \
            scripts/fix-v123-patcher-r2.py \
            scripts/finalize-v123-r3.py
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/integrated-entry\.js|src/stt-v45\.js|src/telephony/index\.js|wrangler\.jsonc|tests/gemini-generic-verification-v57\.test\.mjs|tests/gemini-personalization-v55\.test\.mjs|tests/phone-conversation-baseline-lock-v118\.test\.mjs|tests/phone-grounding-profile-v121\.test\.mjs|tests/phone-jma-weather-v122\.test\.mjs|tests/phone-quality-personalization-v120\.test\.mjs|tests/phone-second-turn-ack-zip-v119\.test\.mjs|tests/phone-stability-baseline-v123\.test\.mjs|tests/voice-cancel-noise-v58\.test\.mjs|tests/voice-latency-invariants\.test\.mjs)$' || true)"
          test -z "$unexpected"
      - name: Commit verified v123 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore phone search audio and noise stability v123'
          git push origin HEAD:repair/phone-stability-v123
