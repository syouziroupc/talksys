name: One-off inspect JMA v122

on:
  push:
    branches: [fix/jma-weather-v122]
    paths: ['.github/workflows/oneoff-inspect-jma-v122.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch JMA area and Oita forecast JSON
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://www.jma.go.jp/bosai/common/const/area.json -o area.json
          curl -fsS --max-time 20 https://www.jma.go.jp/bosai/forecast/data/forecast/440000.json -o forecast-440000.json
          node - <<'NODE' > inspection.txt
          const fs=require('fs');
          const area=JSON.parse(fs.readFileSync('area.json','utf8'));
          const fc=JSON.parse(fs.readFileSync('forecast-440000.json','utf8'));
          const code='4420200';
          let cur=code; const chain=[];
          for(let i=0;i<10&&cur;i++){
            let found=null, cls='';
            for(const key of ['class20s','class15s','class10s','offices','centers']){
              if(area[key]?.[cur]){found=area[key][cur];cls=key;break;}
            }
            if(!found) break;
            chain.push({code:cur,class:cls,...found});
            cur=found.parent||'';
          }
          console.log(JSON.stringify({chain},null,2));
          console.log('forecast0=',JSON.stringify(fc[0],null,2).slice(0,20000));
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: jma-v122-inspection
          path: |
            inspection.txt
            area.json
            forecast-440000.json
