name: One-off phone fast ack recovery v116r

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-phone-fast-ack-recovery-v116r.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Apply minimal phone fast-ack recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/telephony/index.js')
          s = source.read_text(encoding='utf-8')
          old_ack = "const FAST_ACK_TEXT = 'はい、少々お待ちください。';"
          new_ack = "const FAST_ACK_TEXT = 'はい。';"
          if s.count(old_ack) != 1:
              raise SystemExit(f'expected exactly one current FAST_ACK_TEXT, got {s.count(old_ack)}')
          s = s.replace(old_ack, new_ack, 1)

          warm_call = "trackTask(warmPhoneAckPrimaries(env,deps).then((count)=>console.log(JSON.stringify({type:'phone_fast_ack_primary_warm',revision:PHONE_FAST_ACK_REVISION,count}))).catch((error)=>console.warn(JSON.stringify({type:'phone_fast_ack_primary_warm_error',error:clean(error?.message||error,240)}))));return;"
          if s.count(warm_call) != 1:
              raise SystemExit(f'expected exactly one startup primary warm call, got {s.count(warm_call)}')
          s = s.replace(warm_call, 'return;', 1)
          source.write_text(s, encoding='utf-8')

          test = Path('tests/phone-fast-reaction-v2.test.mjs')
          t = test.read_text(encoding='utf-8')
          old_literal = 'はい、少々お待ちください。'
          if t.count(old_literal) < 5:
              raise SystemExit(f'expected existing fallback assertions, got {t.count(old_literal)}')
          t = t.replace(old_literal, 'はい。')
          anchor = "  assert.match(source, /phone_fast_ack_lazy_warm/);\n"
          if anchor not in t:
              raise SystemExit('lazy warm assertion anchor missing')
          t = t.replace(anchor, anchor + "  assert.doesNotMatch(source, /trackTask\\(warmPhoneAckPrimaries\\(env,deps\\)/);\n", 1)
          test.write_text(t, encoding='utf-8')

          Path('.deploy/production-trigger.txt').write_text('phone-fast-ack-recovery-v116r-20261011\n', encoding='utf-8')
          PY
      - name: Validate recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const FAST_ACK_TEXT = 'はい。';" src/telephony/index.js
          if grep -Fq "trackTask(warmPhoneAckPrimaries(env,deps)" src/telephony/index.js; then exit 1; fi
          grep -Fq "if(ackSelection.warmText)" src/telephony/index.js
          grep -Fq "async function answerWithTalkSys(deps, text, history, signal, spokenBackchannel = '', sessionId = '', utteranceId = '')" src/telephony/index.js
          grep -Fq "const turnPromise=answerWithTalkSys(deps,stt.text,history,controller.signal,spokenBackchannel,callId,turnId)" src/telephony/index.js
          node --input-type=module -e "import('./src/telephony/index.js').then(m=>{const r=m.selectPhoneAckText({kind:'lookup',shouldSpeak:true,terminal:false},['はい。'],[]);if(r.text!=='はい。')process.exit(1)})"
      - name: Validate full regression
        shell: bash
        run: |
          set -euo pipefail
          node --check src/telephony/index.js
          node --test tests/phone-fast-reaction-v2.test.mjs tests/phone-greeting-latency-v114.test.mjs tests/phone-profile-preload-v116a.test.mjs
          npm run architecture:check
          npm run architecture:graph
          npm run reuse:check
          npm test
          npx wrangler deploy --dry-run
      - name: Verify source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --exit-code -- src/integrated-entry.js src/stt-v45.js src/telephony/phone-tts.js src/telephony/codec.js src/telephony/protocol.js wrangler.jsonc
          git diff --check
      - name: Commit verified recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/oneoff-phone-fast-ack-recovery-v116r.yml
          git add src/telephony/index.js tests/phone-fast-reaction-v2.test.mjs .deploy/production-trigger.txt
          git diff --cached --check
          git commit -m 'Restore phone fast acknowledgement without changing answer quality v116r'
          git push origin HEAD:main
