name: Build personalization web dashboard
on:
  push:
    branches: [v129-personalization-web-dashboard]
    paths:
      - 'scripts/build-personalization-dashboard.py'
      - '.github/workflows/build-personalization-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v129-personalization-web-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply isolated dashboard patch
        run: python3 scripts/build-personalization-dashboard.py
      - name: Syntax check
        run: node --check src/telephony/index.js
      - name: Focused personalization dashboard regression
        run: node --test tests/v129-rescue-personalization-web.test.mjs
      - name: Full active regression suite
        run: npm test
      - name: Commit validated dashboard
        run: |
          git config user.name 'talksys-ci'
          git config user.email 'talksys-ci@users.noreply.github.com'
          git add src/telephony/index.js tests/v129-rescue-personalization-web.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No dashboard changes to commit'
          else
            git commit -m 'Expose personalization operations dashboard on web'
            git push origin HEAD:v129-personalization-web-dashboard
          fi
