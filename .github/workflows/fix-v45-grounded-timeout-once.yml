name: Fix v45 grounded timeout once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-v45-grounded-timeout]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply grounded fallback migration
        run: python scripts/apply-grounded-timeout-v45.py
      - name: Validate targeted behavior
        run: |
          node --check src/worker-v44.js
          node --test tests/v45-grounded-timeout.test.mjs tests/v45-model-timeout.test.mjs tests/v45-unified-router.test.mjs tests/v45-production-smoke-fixes.test.mjs tests/v44-deep-search-default.test.mjs
      - name: Run full validation
        run: |
          npm test
          npx wrangler deploy --dry-run
      - name: Commit verified grounded fallback
        run: |
          git config user.name talksys-router-fix-bot
          git config user.email actions@users.noreply.github.com
          git add src/worker-v44.js tests/v45-grounded-timeout.test.mjs
          git commit -m 'Preserve grounded evidence when answer synthesis times out'
          git push
