name: Validate phone Grok PCMU v87

on:
  push:
    branches: [phone-grok-pcmu-v87]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phone-grok-pcmu-v87
  cancel-in-progress: true

jobs:
  validate-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phone-grok-pcmu-v87
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply minimal phone PCMU patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "talksys-telephony-v87-grok-pcmu-paced" src/telephony/index.js; then
            echo "v87 patch already applied"
          else
            python3 .diagnostics/apply-phone-grok-pcmu-v87.py
          fi

      - name: Run focused phone PCMU tests
        run: node --test tests/phone-pcmu-v87.test.mjs tests/telephony-integration.test.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run active TalkSys tests
        run: npm test

      - name: Architecture checks
        run: npm run architecture:check

      - name: Commit validated branch changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telephony/index.js src/telephony/protocol.js tests/telephony-integration.test.mjs
          git commit -m "Apply validated phone Grok PCMU v87 transport"
          git push origin HEAD:phone-grok-pcmu-v87
