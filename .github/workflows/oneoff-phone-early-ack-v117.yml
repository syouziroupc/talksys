name: One-off phone early ack v117

on:
  push:
    branches: [fix/phone-early-ack-v117]
    paths:
      - '.github/workflows/oneoff-phone-early-ack-v117.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Apply early acknowledgement patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-phone-early-ack-v117.py
      - name: Enforce source scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          for f in "${changed[@]}"; do
            case "$f" in
              src/telephony/index.js|tests/phone-latency-fast-ack-v90.test.mjs|tests/phone-early-ack-v117.test.mjs) ;;
              *) echo "unexpected patch scope: $f"; exit 1 ;;
            esac
          done
      - name: Validate focused phone latency regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check src/telephony/index.js
          node --test \
            tests/phone-latency-fast-ack-v90.test.mjs \
            tests/phone-early-ack-v117.test.mjs \
            tests/phone-greeting-latency-v114.test.mjs \
            tests/phone-personalization-profile-v115.test.mjs \
            tests/phone-profile-preload-v116a.test.mjs
      - name: Validate full regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:check
          npm run architecture:graph
          npm test
          npx wrangler deploy --dry-run
      - name: Commit verified branch patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/oneoff-phone-early-ack-v117.yml scripts/apply-phone-early-ack-v117.py
          git add src/telephony/index.js tests/phone-latency-fast-ack-v90.test.mjs tests/phone-early-ack-v117.test.mjs
          git commit -m 'Start phone acknowledgement before STT wait v117'
          git push origin HEAD:fix/phone-early-ack-v117
