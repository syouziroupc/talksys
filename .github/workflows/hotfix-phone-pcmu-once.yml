name: Recover phone audio with Melo TTS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-phone-pcmu-once.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore only the pre-Grok phone TTS change
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 7a78ce458b8ef73c5ff4fc3e9312998a4382763b^{commit}
          git show 7a78ce458b8ef73c5ff4fc3e9312998a4382763b:src/telephony/index.js > src/telephony/index.js
          git show 7a78ce458b8ef73c5ff4fc3e9312998a4382763b:tests/telephony-integration.test.mjs > tests/telephony-integration.test.mjs
          grep -q "CloudflareJapaneseTTS" src/telephony/index.js
          grep -q "talksys-telephony-v84-shared-turn-dedupe" src/telephony/index.js
          ! grep -q "xai/grok-tts" src/telephony/index.js

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Validate recovered phone path
        shell: bash
        run: |
          set -euo pipefail
          node --check src/telephony/index.js
          node --check src/telephony/protocol.js
          npm run architecture:check
          npm run architecture:graph
          npm test
          npx wrangler deploy --dry-run

      - name: Commit validated recovery to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/telephony/index.js tests/telephony-integration.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No recovery changes detected'; exit 1; }
          git commit -m 'Restore phone Melo TTS after Grok audio regression'
          git push origin HEAD:main

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${GEMINI_API_KEY:-}"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            account_id="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/accounts?per_page=1 | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.result?.[0]?.id||'')")"
            test -n "$account_id"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi

      - name: Deploy recovered worker
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require('fs');
          const gemini = process.env.GEMINI_API_KEY || '';
          if (!gemini) throw new Error('GEMINI_API_KEY is required');
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify({ GEMINI_API_KEY: gemini }));
          NODE
          npx wrangler deploy --secrets-file "$secrets_file"

      - name: Verify production recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/telephony-health" || true)"
            if BODY="$body" node - <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (d.revision !== 'talksys-telephony-v84-shared-turn-dedupe') process.exit(1);
          if (!String(d.outputAudio || '').includes('TalkSys TTS MP3')) process.exit(1);
          NODE
            then
              echo "$body"
              exit 0
            fi
            sleep 3
          done
          echo 'Production did not report the recovered Melo phone contract.'
          exit 1
