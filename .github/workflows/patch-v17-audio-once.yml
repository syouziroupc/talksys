name: Patch v17 speech playback clarity once

on:
  push:
    branches:
      - fix/v17-five-whys-search
    paths:
      - '.github/workflows/patch-v17-audio-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v17-five-whys-search
      - name: Improve speech playback clarity
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/cloudflare-live-client.js'); s=p.read_text(); old='      source.buffer = decoded;\\n      source.connect(audioContext.destination);\\n      playbackSource = source;\\n'; new='      source.buffer = decoded;\\n      // Speech-first playback chain: modest compression evens out level differences.\\n      const compressor = audioContext.createDynamicsCompressor();\\n      compressor.threshold.value = -24;\\n      compressor.knee.value = 18;\\n      compressor.ratio.value = 3;\\n      compressor.attack.value = 0.006;\\n      compressor.release.value = 0.18;\\n      const speechGain = audioContext.createGain();\\n      speechGain.gain.value = 1.12;\\n      source.connect(compressor);\\n      compressor.connect(speechGain);\\n      speechGain.connect(audioContext.destination);\\n      playbackSource = source;\\n'; assert old in s, 'audio playback anchor not found'; s=s.replace(old,new,1); old_rate='      utterance.rate = 1.04;'; assert old_rate in s, 'device fallback rate anchor not found'; s=s.replace(old_rate,'      utterance.rate = 0.98;',1); p.write_text(s)"
          node --check src/cloudflare-live-client.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name syouziroupc
          git config user.email syouziroupc@gmail.com
          git add src/cloudflare-live-client.js
          git commit -m "Improve Japanese speech playback clarity"
          git push origin HEAD:fix/v17-five-whys-search
