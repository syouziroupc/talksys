name: One-off prompt A/B v2

on:
  push:
    branches:
      - qa/expanded-ai-quality-prompt-audit-v1
    paths:
      - 'scripts/experimental-prompt-ab-v2.mjs'
      - '.github/workflows/oneoff-prompt-ab-v2.yml'

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AUDIT_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate experiment
        run: |
          set -euo pipefail
          node --check scripts/experimental-prompt-ab-v2.mjs
          test -n "${GEMINI_API_KEY:-}"
      - name: Run experiment
        run: node scripts/experimental-prompt-ab-v2.mjs
      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifacts/prompt-ab-v2/report.md ]]; then cat artifacts/prompt-ab-v2/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-ab-v2-report
          path: artifacts/prompt-ab-v2/
          retention-days: 30
