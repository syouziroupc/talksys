name: Validate search grounding fix

on:
  push:
    branches: ['fix/search-grounding-v16']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check changed JavaScript syntax
        run: |
          node --check src/streaming-workers-ai.js
          node --check src/search-rerank.js
          node --check tests/streaming-workers-ai.test.mjs
          node --check tests/search-rerank.test.mjs
      - name: Run test suite
        run: npm test
      - name: Check Wrangler bundle
        run: npx wrangler deploy --dry-run
