name: Apply v18 typed-speech patch once

on:
  push:
    branches: [fix/v18-typed-speech-connectivity-search-progress]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v18-typed-speech-connectivity-search-progress
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_v18_typed_speech_patch.py
      - name: Commit patch and remove one-shot helpers
        run: |
          git rm .github/workflows/v18-typed-speech-patch-once.yml
          git rm .github/scripts/apply_v18_typed_speech_patch.py
          git config user.name talksys-ci
          git config user.email talksys-ci@users.noreply.github.com
          git add src tests
          git commit -m "v18.1: add typed speech, connection timeout, and contextual search progress"
          git push origin HEAD:fix/v18-typed-speech-connectivity-search-progress
