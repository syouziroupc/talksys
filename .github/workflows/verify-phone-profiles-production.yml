name: Verify production phone profiles display button

on:
  push:
    branches: [fix-phone-profiles-login-button]
    paths:
      - '.github/workflows/verify-phone-profiles-production.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify live rendered script and display-button binding
        shell: bash
        run: |
          set -euo pipefail
          url='https://talksys.syouziroupc.workers.dev/phone-profiles'
          curl -fsS --max-time 30 "$url" -o /tmp/page.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/page.html').read_text()
          m=re.search(r'<script>(.*?)</script>', html, re.S)
          if not m: raise SystemExit('inline script missing')
          if 'id="loginBtn"' not in html: raise SystemExit('login button missing')
          Path('/tmp/inline.js').write_text(m.group(1))
          print('production-button-present=true')
          print('production-script-bytes='+str(len(m.group(1))))
          PY
          node --check /tmp/inline.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const elements=new Map();
          const make=id=>({id,value:'',textContent:'',innerHTML:'',className:'',dataset:{},onclick:null,classList:{add(){},remove(){}},addEventListener(){},querySelectorAll(){return[]}});
          global.sessionStorage={getItem(){return ''},setItem(){}};
          global.document={getElementById(id){if(!elements.has(id))elements.set(id,make(id));return elements.get(id)},querySelectorAll(){return[]}};
          global.location={href:'https://talksys.syouziroupc.workers.dev/phone-profiles'};
          global.history={replaceState(){}};
          global.alert=()=>{};
          vm.runInThisContext(fs.readFileSync('/tmp/inline.js','utf8'));
          const btn=document.getElementById('loginBtn');
          if(typeof btn.onclick!=='function') throw new Error('production loginBtn onclick not bound');
          console.log('production-login-binding=ok');
          NODE
